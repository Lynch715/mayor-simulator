<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工业审批 · 隔离验收</title>
<style>body{font:14px system-ui;margin:16px;background:#eae8e1;color:#22252a}button,select{font:inherit;min-height:44px;padding:6px 12px;margin:4px}.controls{position:sticky;top:0;background:#eae8e1;z-index:10}iframe{display:block;height:850px;border:1px solid #aaa;background:white}#wrap{overflow:auto;max-width:100%}pre{white-space:pre-wrap}</style>
<h1>工业审批 · 隔离验收</h1><p>真实游戏在内存存储中运行；不读取或写入玩家存档。手机范围为视口模拟。</p>
<div class="controls"><button id="run" disabled>运行审批完整流程</button><button id="legacy" disabled>展示旧档已获批</button><button id="fresh" disabled>展示待审批项目</button><button id="county" disabled>展示市级会审</button><label>预览宽度 <select id="width"><option>1280</option><option>640</option><option selected>390</option><option>320</option></select></label><strong id="status">加载中</strong></div>
<pre id="results"></pre><div id="wrap"><iframe id="game" title="隔离测试游戏" style="width:390px"></iframe></div>
<script>
const frame=document.querySelector('#game'),status=document.querySelector('#status'),out=document.querySelector('#results');
const run=code=>frame.contentWindow.eval(code),wait=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
let checks=0,failures=[];
function assert(ok,label){checks++;if(!ok)throw Error(label);}
function sample(level=0,legacy=false){
 run(`newGame();${level?'initLevel('+level+',0);':''}S.cash=1000000;S.env=85;S.npc.boss.f=100;Math.random=()=>.8;S.tab='build';S.buildCat='ind';S.planZone='heavy';${legacy?'S.phase1.permits.factory=1;save();load();':''}$('#cover').style.display='none';hideDoc();busy=false;renderAll();`);
}
function doc(){return frame.contentDocument;}
function card(id){return doc().querySelector(`[data-build="${id}"]`).closest('.fac');}
function geometry(label){
 const d=doc(),width=frame.clientWidth;assert(d.documentElement.scrollWidth<=width+1,label+' 页面横向溢出');
 for(const id of ['metal','paper','chemical','refinery']){const c=card(id),box=c.getBoundingClientRect();assert(box.right<=width+1,label+' 卡片溢出 '+id);
  for(const b of c.querySelectorAll('button')){const r=b.getBoundingClientRect();if(width<=640||b.closest('.phase-permit'))assert(r.height>=39,label+' 按钮过矮 '+id+' '+b.textContent+' '+r.height);assert(r.left>=box.left-1&&r.right<=box.right+1,label+' 按钮越界 '+id);}
 }
}
async function advance(){
 doc().querySelector('#nextbtn').click();assert(!!doc().querySelector('#modal.on'),'下月显示月结弹窗');
 for(let i=0;i<15&&doc().querySelector('#modal.on');i++){const b=Array.from(doc().querySelectorAll('#doc .opts button')).find(b=>!b.disabled);assert(!!b,'弹窗操作可达');b.click();await wait();}
 assert(!doc().querySelector('#modal.on'),'月结事件处理完成');assert(!run('busy'),'推进流程解锁');
}
document.querySelector('#width').onchange=async e=>{frame.style.width=e.target.value+'px';await wait();run('fitTabs()');};
document.querySelector('#legacy').onclick=()=>{sample(0,true);card('metal').scrollIntoView({block:'center'});status.textContent='旧档通用审批：可直接立项';};
document.querySelector('#fresh').onclick=()=>{sample();status.textContent='项目卡片可直接申报';};
document.querySelector('#county').onclick=()=>{sample(1);status.textContent='县级重污染项目需市级会审';};
document.querySelector('#run').onclick=async()=>{
 checks=0;failures=[];status.textContent='验收中';document.querySelector('#run').disabled=true;
 try{
  for(const width of [1280,640,390,320]){
   frame.style.width=width+'px';await wait();sample();geometry(width+' 待审批');
   assert(card('paper').querySelector('[data-build]').disabled,'未批不能立项');
   doc().querySelector('[data-phase-action="permit_factory"]').click();assert(run('S.ag')==='permit_factory','点击通用申报安排本月工作');assert(!run('S.phase1.permits.factory'),'安排不立即授予资格');assert(card('paper').textContent.includes('本月已安排审批'),'显示待办状态');
   await advance();assert(run('S.phase1.permits.factory')===1,'真实下月审批通过');
   assert(!card('paper').querySelector('[data-build]').disabled,'审批后造纸按钮可用');assert(card('paper').textContent.includes('含通用1项'),'卡片显示已获批');geometry(width+' 已获批');
   card('paper').querySelector('[data-build]').click();assert(run('S.build.some(b=>b.id==="paper")'),'点击立项进入真实建设队列');assert(run('S.phase1.permits.factory')===0,'成功立项扣一份通用审批');assert(card('metal').querySelector('[data-build]').disabled,'用完后其他高污染项目被拦截');
   sample();card('metal').querySelector('[data-phase-action="permit_metal"]').click();assert(run('S.ag')==='permit_metal','卡片直接申报专属审批');await advance();assert(run('S.phase1.permits.metal')===1,'专属审批通过');card('metal').querySelector('[data-build]').click();assert(run('S.phase1.permits.metal')===0,'专属审批仅扣一次');
   sample(0,true);assert(!card('metal').querySelector('[data-build]').disabled,'旧档已取得资格直接生效');card('metal').querySelector('[data-build]').click();assert(run('S.phase1.permits.factory')===0,'读档后的通用资格正确消耗');
   sample(1);geometry(width+' 市级会审');assert(card('refinery').querySelector('[data-build]').disabled,'未会审不可立项');card('refinery').querySelector('[data-phase-action="permit_refinery"]').click();await advance();assert(!card('refinery').querySelector('[data-build]').disabled,'市级会审后可立项');card('refinery').querySelector('[data-build]').click();assert(run('S.phase1.permits.refinery')===0,'市级会审单独消耗');
  }
 }catch(e){failures.push(e.stack);}
 frame.style.width='390px';document.querySelector('#width').value='390';sample(0,true);await wait();
 const result={checks,failures,isolatedStorage:true,scope:'1280 / 640 / 390 / 320px; generic and dedicated county approvals, actual next-month dialogs, construction, save/load, municipal review',physicalDevice:false};
 out.textContent=JSON.stringify(result,null,2);status.textContent=failures.length?'验收失败':'全部通过';document.querySelector('#run').disabled=false;
};
(async()=>{
 let html=await(await fetch('../../index.html',{cache:'no-store'})).text();
 const shim=`<script>const qaStore=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>qaStore.get(k)||null,setItem:(k,v)=>qaStore.set(k,String(v)),removeItem:k=>qaStore.delete(k)}});window.addEventListener('error',e=>parent.document.querySelector('#results').textContent+='\\n'+e.message);<\/script>`;
 html=html.replace('<head>','<head><base href="'+new URL('../../',location.href)+'">').replace('<script>',shim+'<script>');
 frame.onload=()=>{document.querySelectorAll('.controls button').forEach(b=>b.disabled=false);sample(0,true);status.textContent='隔离环境就绪';if(new URLSearchParams(location.search).get('preview')==='legacy'){document.body.style.margin='0';document.querySelectorAll('body>h1,body>p,.controls,#results').forEach(e=>e.style.display='none');frame.style.cssText='width:100%;height:100vh;border:0';card('metal').scrollIntoView({block:'start'});}};frame.srcdoc=html;
})();
</script></html>

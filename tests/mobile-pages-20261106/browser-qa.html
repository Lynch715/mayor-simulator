<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全页面手机排版 · 隔离验收</title>
<style>body{font:14px system-ui;margin:12px;background:#eae8e1;color:#22252a}button,select{font:inherit;min-height:44px;padding:6px 10px;margin:3px}.controls{display:flex;flex-wrap:wrap;align-items:center}#wrap{max-width:100%;overflow:auto}iframe{display:block;border:0;background:#f3f2ee}pre{white-space:pre-wrap}body.preview{margin:0}.preview>.controls,.preview>pre{display:none}</style>
<div class="controls"><button id="scan" disabled>检查全部页面</button><button id="dialogs" disabled>检查弹窗</button><button id="show" disabled>展示当前场景</button><select id="level" aria-label="职务"><option value="0">镇级</option><option value="1">县级</option><option value="2">地级市</option><option value="3">副省级</option><option value="4" selected>直辖市</option></select><select id="page" aria-label="页面"><option value="over">总览</option><option value="ind">产业</option><option value="land">土地</option><option value="region">区域</option><option value="district">区县</option><option value="file">档案</option><option value="fin">财政</option><option value="debt">债务</option><option value="hr">人事</option><option value="business">经营</option><option value="projects">项目</option><option value="build">建设</option><option value="honors">成就</option><option value="ranking">排名</option></select><strong id="status">加载中</strong></div><pre id="results"></pre><div id="wrap"><iframe id="game" title="隔离样本游戏"></iframe></div>
<script>
const frame=document.querySelector('#game'),out=document.querySelector('#results'),status=document.querySelector('#status'),query=new URLSearchParams(location.search),run=code=>frame.contentWindow.eval(code),doc=()=>frame.contentDocument,wait=()=>new Promise(r=>setTimeout(r,50));let fixtures=[],rows=[],errors=[],busyQa=false;
function sample(lv,stress=true){
 frame.contentWindow.qaFixture=JSON.parse(JSON.stringify(fixtures[lv]));
 run(`Math.random=(()=>{let seed=71834;return ()=>((seed=(1664525*seed+1013904223)>>>0)/4294967296)})();S=qaFixture;migrate();S.cash=12345678;S.env=75;S.over=null;S.phase='work';S.ag='routine';S.buildCat='ind';S.planZone='heavy';S.phase1.resources=['煤炭','油气'];for(const [id] of SOE)S.phase1.permits[id]=2;hideDoc();busy=false;$('#cover').style.display='none';`);
 if(stress)run(`S.year=8+S.lvl*6;S.age=31+S.year;S.tenure=3;S.ratings=Array.from({length:S.year-1},(_,i)=>['A','B','B','C'][i%4]);S.reserve=765432;S.platform=234567;S.sb=[{amt:345678,rate:2.8,left:48,term:60}];S.cq.push({amt:123456,rate:7,left:36,term:60});S.f.power+=100;S.f.water+=100;S.f.sewage+=100;S.phase2.team.forEach(c=>c.post=c.skill);for(const skill of ['commerce','eco'])if(!roleMember(skill))recruitSpecialist(skill);S.hist=Array.from({length:S.lvl},(_,i)=>({lvl:i,city:LV[i].city,years:5+i,built:45+i*19,hdr:78,grades:'ABBABACABABABA',sat:68,pros:65,liv:60,debt:84,pros0:60,debt0:80,leftY:3+i*5,after:5+i}));for(const id of ['paper','lng','compute']){S.f[id]=(S.f[id]||0)+2;S.ind.push({id,age:60,cut:0});}syncFirms();for(const id of ['paper','lng','solar'])queueBuild(id);S.build.forEach(b=>{b.paid=b.cost*.35;});S.phase2.offers.push({uid:'qa-offer',type:'road',n:'城市主干道新建/改造',cost:1234567,award:1234000,months:8,state:'offered'});for(const k of ['v114','v113','v112','v111'])LS.set('yifang_save_before_'+k,'{}');`);
 if(query.has('retired'))run("S.phase='retired';S.retY=5;");
 run("S.tab='over';renderAll();");
}
function rect(el){const r=el.getBoundingClientRect();return {x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),right:+r.right.toFixed(1),bottom:+r.bottom.toFixed(1)};}
function measure(label){
 const d=doc(),w=frame.contentWindow,W=d.documentElement.clientWidth,H=d.documentElement.clientHeight,modal=d.querySelector('#modal.on'),root=modal?d.querySelector('#doc'):d.querySelector('#panel'),issues=[],details=[];
 const add=(kind,el,extra={})=>issues.push({kind,text:el?.textContent?.trim().slice(0,120),rect:el?rect(el):null,...extra});
 if(d.documentElement.scrollWidth>W+1)add('page-overflow',d.documentElement,{viewport:W,scrollWidth:d.documentElement.scrollWidth});
 const visible=el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&w.getComputedStyle(el).visibility!=='hidden';};
 for(const el of root.querySelectorAll('th,td,button,.tag')){
  if(!visible(el))continue;const r=el.getBoundingClientRect(),cs=w.getComputedStyle(el),text=el.textContent.trim(),chars=(text.match(/[\u3400-\u9fff]/g)||[]).length,fs=parseFloat(cs.fontSize)||14;
  if(el.matches('th,td,.tag')&&!el.querySelector('button,select,input')&&chars>=2&&r.width<fs*2.1&&r.height>fs*2.4)add('vertical-text',el);
  if(el.matches('button')&&el.scrollWidth>el.clientWidth+2)add('button-text-clipped',el,{scrollWidth:el.scrollWidth,clientWidth:el.clientWidth});
  if(el.matches('button,.tag')&&!el.closest('.phase-scroll,.map-wrap,#tabs')&&(r.left< -1||r.right>W+1))add('element-outside-page',el);
 }
 for(const table of root.querySelectorAll('table')){
  if(!visible(table))continue;const wrapped=table.closest('.phase-scroll,.m-table-wrap');
  if(!wrapped&&table.getBoundingClientRect().right>W+1)add('uncontained-table',table);
  if(table.classList.contains('m-cards')&&W<=640&&wrapped&&wrapped.scrollWidth>wrapped.clientWidth+1)add('card-table-inner-overflow',table,{available:wrapped.clientWidth,content:wrapped.scrollWidth});
 }
 for(const group of root.querySelectorAll('.phase-actions,.pb,.tal,.tiers,.sec')){
  const bs=Array.from(group.children).filter(e=>e.tagName==='BUTTON'&&visible(e));
  for(let i=1;i<bs.length;i++){const a=bs[i-1].getBoundingClientRect(),b=bs[i].getBoundingClientRect();const overlapX=Math.min(a.right,b.right)-Math.max(a.left,b.left),overlapY=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);if(overlapX>1&&overlapY>1)add('buttons-overlap',bs[i]);else if((overlapX>5&&Math.abs(b.top-a.bottom)<3)||(overlapY>5&&Math.abs(b.left-a.right)<3))add('buttons-touching',bs[i]);}
 }
 if(!modal){
  for(const el of root.querySelectorAll('button,select,input[type=number]')){
   if(!visible(el)||el.closest('.phase-scroll'))continue;const r=el.getBoundingClientRect();w.scrollBy(0,r.top-(H-r.height)/2);const b=el.getBoundingClientRect(),x=Math.max(1,Math.min(W-1,b.left+b.width/2)),y=Math.max(1,Math.min(H-1,b.top+b.height/2));const hit=d.elementFromPoint(x,y);const inset=Math.min(12,b.width/3,b.height/3),points=[[x,y],[b.left+inset,b.top+inset],[b.right-inset,b.top+inset],[b.left+inset,b.bottom-inset],[b.right-inset,b.bottom-inset]];const blocked=points.map(([px,py])=>d.elementFromPoint(px,py)).find(target=>!el.contains(target)&&target!==el);if(b.top< -1||b.bottom>H+1||blocked||(!el.contains(hit)&&hit!==el))add('control-unreachable',el,{hit:blocked?.id||blocked?.className||hit?.tagName});
  }
 }else{
  const box=root.getBoundingClientRect();if(box.top< -1||box.bottom>H+1)add('modal-outside-viewport',root);
  for(const el of root.querySelectorAll('.opts button')){if(!visible(el))continue;const r=el.getBoundingClientRect();root.scrollTop+=r.top-box.top-12;const b=el.getBoundingClientRect();if(b.top<box.top-1||b.bottom>box.bottom+1)add('modal-option-unreachable',el);}
  root.scrollTop=0;
 }
 for(const el of root.querySelectorAll('.phase-scroll')){if(visible(el))details.push({scrollable:el.scrollWidth>el.clientWidth+1,hint:el.classList.contains('is-overflow')});}
 return {label,screen:[W,H],issues,scrolls:details};
}
async function page(lv,tab,stress=true){sample(lv,stress);const [view,cat]=tab.split(':');run(`S.tab='${view}';${cat?"S.buildCat='"+cat+"';":''}renderAll();`);await wait();}
function sizes(){return [[320,667],[360,800],[375,667],[390,844],[640,800],[1280,800]].filter(([w])=>!query.get('width')||query.get('width').split(',').includes(String(w)));}
async function scan(){if(busyQa)return;busyQa=true;rows=[];errors=[];try{for(const [W,H] of sizes()){frame.style.width=W+'px';frame.style.height=H+'px';await wait();for(let lv=0;lv<5;lv++){sample(lv);const tabs=Array.from(doc().querySelectorAll('#tabs button'),b=>b.dataset.t).flatMap(t=>t==='build'?['build:traffic','build:people','build:infra','build:eco','build:ind']:t==='ranking'?['ranking','ranking:city']:[t]);for(const tab of tabs){status.textContent=W+'px / '+lv+' / '+tab;await page(lv,tab);if(tab==='ranking:city'){run("rankView='city';renderAll()");await wait();}rows.push({level:lv,...measure(tab)});}}}}catch(e){errors.push(e.stack);}const counts={};for(const row of rows)for(const issue of row.issues)counts[issue.kind]=(counts[issue.kind]||0)+1;out.textContent=JSON.stringify({pages:rows.length,issuePages:rows.filter(r=>r.issues.length).length,counts,errors,rows,storage:'in-memory only'},null,2);status.textContent=errors.length?'检查异常':'页面检查完成';busyQa=false;}
async function dialogs(){if(busyQa)return;busyQa=true;rows=[];errors=[];try{for(const [W,H] of [[320,667],[375,667],[390,844],[568,320],[1280,800]]){frame.style.width=W+'px';frame.style.height=H+'px';for(const kind of ['monthly','review','event','ending']){sample(4,false);run("S.cash=12345678;S.ratings=['A','B','A'];");if(kind==='monthly')run("var qaBefore={y:S.year,m:S.month,cash:S.cash,pros:S.pros,liv:S.liv,sat:S.sat,env:S.env,hdr:hdr(),pop:S.pop,rep:S.rep,unity:S.unity,seq:S.logSeq};tick();showMonthly(qaBefore,()=>{});");if(kind==='review')run('showReview(annual(),()=>{})');if(kind==='event')run("showEvent(findEvent('p3_fixture_pet'),()=>{})");if(kind==='ending')run("endGame('retire_top');showEnding()");await wait();rows.push(measure(kind));}}}catch(e){errors.push(e.stack);}out.textContent=JSON.stringify({dialogs:rows.length,errors,rows,storage:'in-memory only'},null,2);status.textContent='弹窗检查完成';busyQa=false;}
async function show(){const lv=+(query.get('level')||document.querySelector('#level').value),tab=query.get('page')||document.querySelector('#page').value;frame.style.width=(query.has('preview')?innerWidth:390)+'px';frame.style.height=(query.has('preview')?innerHeight:844)+'px';await page(lv,tab);if(query.has('preview')){document.body.classList.add('preview');const label=query.get('section');const target=label?Array.from(doc().querySelectorAll('h2')).find(e=>e.textContent.includes(label)):doc().querySelector('#panel');target?.scrollIntoView({block:'start'});}status.textContent='隔离预览就绪';}
document.querySelector('#scan').onclick=scan;document.querySelector('#dialogs').onclick=dialogs;document.querySelector('#show').onclick=show;
(async()=>{fixtures=await(await fetch('../fixtures/v114-scenes.json')).json();let html=await(await fetch(query.has('before')?'../../backups/index-before-mobile-pages-20261106.html':'../../index.html',{cache:'no-store'})).text();const shim=`<script>const qaStore=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>qaStore.get(k)||null,setItem:(k,v)=>qaStore.set(k,String(v)),removeItem:k=>qaStore.delete(k)}});<\/script>`;html=html.replace('<head>','<head><base href="'+new URL('../../',location.href)+'">').replace('<script>',shim+'<script>');frame.onload=()=>{document.querySelectorAll('.controls button').forEach(b=>b.disabled=false);show();};frame.srcdoc=html;})();
</script></html>

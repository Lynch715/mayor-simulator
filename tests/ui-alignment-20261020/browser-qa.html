<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>界面对齐验收</title>
<style>body{margin:12px;color:#252525;background:#eee9df;font:14px system-ui}button,select{min-height:40px;font:inherit;margin:3px}#toolbar{position:sticky;top:0;background:#eee9df;z-index:2;padding:4px}#wrap{overflow:auto;width:100%}iframe{display:block;border:1px solid #aaa;width:320px;height:568px;background:#fff}#result{white-space:pre-wrap;max-height:160px;overflow:auto}</style>
<div id="toolbar"><button id="onlineStart" disabled>备份原进度并开始验收</button><button id="onlineRestore">恢复原进度</button><button id="onlineExport">导出原进度备份</button><br><b>本地界面对齐验收 · 先备份、测试后原样恢复</b><br><label>屏幕<select id="screen"><option value="320,568">320×568</option><option value="360,640">360×640</option><option value="390,844">390×844</option><option value="768,900">768×900</option><option value="1280,800">1280×800</option><option value="568,320">568×320 横屏</option><option value="812,375">812×375 横屏</option></select></label><label>岗位<select id="level"><option value="0">镇长</option><option value="1">县长</option><option value="2">地级市</option><option value="3">副省级</option><option value="4">直辖市</option></select></label><button id="load">导入审计样本</button><button id="pages">检查全部页面</button><button id="dialogs">检查全部事件弹窗</button><button id="specials">检查月报考核结局</button><br><label>弹窗<select id="event"></select></label><button id="show">展示该弹窗</button><button id="monthly">展示月报</button><button id="hide">关闭审计弹窗</button><button id="measure">测量当前布局</button><button id="compat">检查跨版本存档兼容</button><button id="feedback">制造动态失败反馈</button><button id="fresh">恢复180万正常新局</button><button id="all">运行最终全套验收</button><button id="dynamic">检查结算页动态视口</button><button id="alignment">检查对齐与安全区域</button><button id="safeMonthly">展示带安全区域月报</button><button id="artdelta">检查家庭配图微调</button></div><pre id="result" role="status">载入中</pre><div id="wrap"><iframe id="game" title="审计游戏" src="../../index.html?qa=alignment-safe"></iframe></div>
<script>
const frame=document.querySelector('#game'),result=document.querySelector('#result');const ready=new Promise(r=>frame.addEventListener('load',r,{once:true}));const settle=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let catalog=[],fixtures=[],running=false;
const screens=[[320,568],[360,640],[390,844],[768,900],[1280,800],[568,320],[812,375]];let auditRows=[];
async function screen(w,h){frame.style.width=w+'px';frame.style.height=h+'px';await settle();}
async function load(lv=+document.querySelector('#level').value,custom=null){await ready;const d=frame.contentDocument,w=frame.contentWindow;d.querySelector('#btnNew').click();const file=d.querySelector('#fileIn'),dt=new w.DataTransfer();dt.items.add(new w.File([JSON.stringify(custom||fixtures[lv])],'audit-'+lv+'.json',{type:'application/json'}));file.files=dt.files;file.dispatchEvent(new w.Event('change',{bubbles:true}));for(let i=0;i<70;i++){await settle();if(d.querySelector('#log').textContent.includes('存档已导入'))break;}await settle();w.hideDoc();}
function rect(e){const r=e.getBoundingClientRect();return {x:Math.round(r.x*10)/10,y:Math.round(r.y*10)/10,w:Math.round(r.width*10)/10,h:Math.round(r.height*10)/10,b:Math.round(r.bottom*10)/10,r:Math.round(r.right*10)/10};}
function measure(label){const d=frame.contentDocument,w=frame.contentWindow,modal=d.querySelector('#modal'),active=modal.classList.contains('on'),doc=d.querySelector('#doc'),root=active?doc:d.querySelector('#panel'),issues=[],scrolls=[];const W=d.documentElement.clientWidth,H=d.documentElement.clientHeight;
 if(d.body.scrollWidth>W+2)issues.push({kind:'bodyOverflow',scrollWidth:d.body.scrollWidth,W});
 for(const e of root.querySelectorAll('button,select,input:not([type=range]):not([type=checkbox]),h2,.tag')){const r=rect(e),cs=w.getComputedStyle(e);if(!r.w||!r.h||cs.display==='none')continue;if(e.matches('button')&&e.scrollWidth>e.clientWidth+2)issues.push({kind:'buttonTextOverflow',text:e.textContent.trim(),rect:r,scroll:e.scrollWidth,client:e.clientWidth});if(!active&&!e.closest('.phase-scroll')&&(r.x< -1||r.r>W+1))issues.push({kind:'controlOutsideViewport',text:e.textContent.trim(),rect:r});}
 for(const group of root.querySelectorAll('td,.phase-actions')){const bs=[...group.querySelectorAll(':scope > button')];for(let i=1;i<bs.length;i++){const a=rect(bs[i-1]),b=rect(bs[i]);const gap=b.y>=a.b-1?b.y-a.b:b.x-a.r;if(gap>=-.5&&gap<4)issues.push({kind:'touchingButtons',text:bs.map(b=>b.textContent.trim()).join(' / '),gap,rect:[a,b]});}}
 for(const e of root.querySelectorAll('.phase-scroll')){if(e.scrollWidth>e.clientWidth+2)scrolls.push({width:e.clientWidth,content:e.scrollWidth});}
 if(active){const dr=rect(doc),dh=doc.querySelector('.dh'),body=doc.querySelector('.body'),opts=doc.querySelector('.opts'),or=opts&&rect(opts),br=body&&rect(body);if(dr.y< -1||dr.b>H+1)issues.push({kind:'modalOutsideViewport',rect:dr,H});if(br&&br.h<45&&body.textContent.trim())issues.push({kind:'collapsedModalBody',rect:br,text:body.textContent.slice(0,90)});if(or&&(or.y>=dr.b||or.b>dr.b+1)&&w.getComputedStyle(doc).overflowY==='hidden')issues.push({kind:'clippedDialogOptions',rect:or,doc:dr});const buttons=[...opts.querySelectorAll('button')];if(or&&or.h<Math.min(48,buttons[0]?.getBoundingClientRect().height||48))issues.push({kind:'optionsAreaTooSmall',rect:or});const saved=doc.scrollTop;for(const button of buttons){const before=button.getBoundingClientRect(),dr2=doc.getBoundingClientRect();doc.scrollTop+=before.top-dr2.top-12;const r=button.getBoundingClientRect();if(r.top<dr2.top-1||r.bottom>dr2.bottom+1)issues.push({kind:'unreachableWholeOption',text:button.textContent.slice(0,60),rect:rect(button)});}doc.scrollTop=saved;}
 return {label,screen:[W,H],issues,scrolls};}
async function showEvent(id){await ready;const w=frame.contentWindow;w.hideDoc();const e=catalog.find(e=>e.id===id)||w.findEvent(id);w.showEvent(e,()=>{});await settle();}
document.querySelector('#screen').onchange=async e=>{await screen(...e.target.value.split(',').map(Number));};document.querySelector('#load').onclick=async()=>{await load();result.textContent='正式导入已完成';};document.querySelector('#hide').onclick=()=>frame.contentWindow.hideDoc();document.querySelector('#show').onclick=async()=>{await showEvent(document.querySelector('#event').value);result.textContent=JSON.stringify(measure(document.querySelector('#event').value),null,2);};document.querySelector('#monthly').onclick=()=>{frame.contentDocument.querySelector('#nextbtn').click();};document.querySelector('#measure').onclick=()=>{result.textContent=JSON.stringify(measure('manual'),null,2);};
document.querySelector('#pages').onclick=async()=>{if(running)return;running=true;const rows=[];try{for(let lv=0;lv<5;lv++){await load(lv);for(const [W,H] of screens){await screen(W,H);const d=frame.contentDocument,tabs=[...d.querySelectorAll('#tabs button')].flatMap(b=>b.dataset.t==='build'?['build:traffic','build:people','build:infra','build:eco','build:ind']:[b.dataset.t]);for(const tab of tabs){const [view,cat]=tab.split(':');d.querySelector('[data-t="'+view+'"]').click();if(cat)d.querySelector('[data-cat="'+cat+'"]').click();await settle();rows.push({lv,...measure(tab)});}result.textContent='页面检查 '+lv+' / '+W+'x'+H+'；累计'+rows.length;}}auditRows=rows;result.textContent=JSON.stringify({checks:rows.length,issuePages:rows.filter(r=>r.issues.length).length,issues:rows.filter(r=>r.issues.length)},null,2);}finally{running=false;}};
document.querySelector('#dialogs').onclick=async()=>{if(running)return;running=true;const rows=[];try{await load(4);for(const [W,H] of screens){await screen(W,H);for(const e of catalog){await showEvent(e.id);rows.push(measure(e.id));}result.textContent='弹窗检查 '+W+'x'+H+'；累计'+rows.length;}frame.contentWindow.hideDoc();auditRows=rows;result.textContent=JSON.stringify({checks:rows.length,issueDialogs:rows.filter(r=>r.issues.length).length,issues:rows.filter(r=>r.issues.length)},null,2);}finally{running=false;}};
const specialCases=['monthly','review','promo1','promo2','promo3','promo4',...['fall','fired','debt','sanbao','accident','sidelined','retire_top','retire_good','retire_plain','post_audit'].map(x=>'ending_'+x),...['1','2','3','4','5'].map(x=>'retired_'+x),'retired_bad','retired_project','inspection','industrial_petition','retirement_notice'];
async function showSpecial(k){const input=JSON.parse(JSON.stringify(fixtures[4]));if(k==='review'){input.env=20;input.accountabilityUntil=200;}if(k.startsWith('retired_')){input.phase='retired';input.retY=+k.slice(8)-1;if(k==='retired_bad'){input.retY=1;input.file.push({y:1,t:'审计场景已知严重问题',sev:2,exp:false,mild:false});}if(k==='retired_project'){input.retY=1;input.careerProjects[0].risk={quality:1,environment:1,safety:1};input.careerProjects[0].warningAt=1;}}
 if(k==='inspection'){const p=input.careerProjects.find(p=>p.fac==='paper');p.risk.environment=.7;input.policyNotices.audit_inspection={id:'audit_inspection',name:'两会环保安全专项督查',city:'海屿市',month:1,year:4,checked:1,findings:[p.uid],handled:false};}
 await load(4,input);const w=frame.contentWindow;
 if(k==='monthly'){const B={y:input.year,m:input.month,cash:input.cash,pros:input.pros,liv:input.liv,sat:input.sat,env:input.env,hdr:w.hdr(),pop:input.pop,rep:input.rep,unity:input.unity,seq:input.logSeq||0};w.tick();w.showMonthly(B,()=>{});}
 else if(k==='review')w.showReview(w.annual(),()=>{});
 else if(k.startsWith('promo'))w.showPromo(+k.slice(5),()=>{});
 else if(k.startsWith('ending_')){w.endGame(k.slice(7));w.showEnding();}
 else if(k.startsWith('retired_'))w.showEvent(w.retiredStep(),()=>{});
 else if(k==='inspection')w.showEvent(w.findEvent('audit_inspection'),()=>{});
 else if(k==='industrial_petition')w.showEvent(w.findEvent('p3_fixture_pet'),()=>{});
 else if(k==='retirement_notice')w.showDoc('<div class="dh"><div class="kind">通知</div><h2>关于退休的通知</h2></div><div class="body">65 岁，到点了。正省部级的年龄界限就在这里，组织谈话很短，感谢了你的工作。办公室的人帮你收拾东西，一个纸箱就装完了。\n\n往后几年，每次推进是一年。</div><div class="opts"><button class="opt">离开办公室</button></div>','notice');
 await settle();}
document.querySelector('#specials').onclick=async()=>{if(running)return;running=true;const rows=[];try{for(const [W,H] of screens){await screen(W,H);for(const k of specialCases){await showSpecial(k);rows.push(measure(k));}result.textContent='其他弹窗 '+W+'x'+H+'；累计'+rows.length;}frame.contentWindow.hideDoc();auditRows=rows;result.textContent=JSON.stringify({checks:rows.length,issueDialogs:rows.filter(r=>r.issues.length).length,issues:rows.filter(r=>r.issues.length)},null,2);}catch(e){result.textContent='异常：'+e.stack;}finally{running=false;}};

const stableKeys=['cash','reserve','land','landTotal','landSold','housing','year','month','age','env','merit','ag','build','file','cq','sb','careerProjects','hist','npc','phase1','phase2','phase3'];
function assetDiff(before,after){return stableKeys.filter(k=>before[k]!==undefined&&JSON.stringify(before[k])!==JSON.stringify(after[k]));}
document.querySelector('#compat').onclick=async()=>{if(running)return;running=true;const rows=[];try{for(const family of ['pre-v111-levels','pre-v112-levels','pre-v113-levels','pre-v114-levels','v113-scenes','v114-scenes']){const inputs=await fetch('../fixtures/'+family+'.json').then(r=>r.json());for(let lv=0;lv<5;lv++){await load(lv,inputs[lv]);const d=frame.contentDocument,w=frame.contentWindow;d.querySelector('#btnSave').click();const migrated=JSON.parse(w.localStorage.getItem('yifang_save'));const diff=assetDiff(inputs[lv],migrated);d.querySelector('#btnLoad').click();d.querySelector('#btnSave').click();const reloaded=JSON.parse(w.localStorage.getItem('yifang_save'));rows.push({family,lv,diff,roundtripDiff:assetDiff(migrated,reloaded),revision:reloaded.auditRevision});}result.textContent='存档兼容 '+family+'：'+rows.length;}
result.textContent=JSON.stringify({checks:rows.length,failures:rows.filter(r=>r.diff.length||r.roundtripDiff.length||r.revision!==114),rows},null,2);}catch(e){result.textContent='异常：'+e.stack;}finally{running=false;}};
document.querySelector('#feedback').onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument;w.hideDoc();d.querySelector('[data-t="debt"]').click();d.querySelector('#cqN').value='99999999999';d.querySelector('#btnCQ').click();result.textContent='超额度发行被拒绝，即时提示：'+(d.querySelector('#mtoast')?.textContent||'缺失');};
document.querySelector('#fresh').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow;w.hideDoc();d.querySelector('#btnNew').click();d.querySelector('#btnSave').click();result.textContent='正常新局已恢复并保存：'+d.querySelector('#stats').textContent.replace(/\s+/g,' ');};

document.querySelector('#artdelta').onclick=async()=>{const rows=[];await load(0);for(const [W,H]of screens){await screen(W,H);for(const id of ['relative_canteen','fam_father']){await showEvent(id);const r=measure(id),images=[...frame.contentDocument.querySelectorAll('#doc .portrait img')].map(i=>i.getAttribute('src'));rows.push({...r,images});}}frame.contentWindow.hideDoc();result.textContent=JSON.stringify({checks:rows.length,failures:rows.filter(r=>r.issues.length||r.images.length),rows},null,2);};
document.querySelector('#all').onclick=async()=>{const out={};for(const id of ['pages','dialogs','specials','compat']){await document.querySelector('#'+id).onclick();try{out[id]=JSON.parse(result.textContent);}catch(e){out[id]={error:result.textContent};break;}}result.textContent=JSON.stringify(out,null,2);};


function safeInsets(on){const m=frame.contentDocument.querySelector('#modal');m.style.paddingTop=on?'54px':'';m.style.paddingBottom=on?'44px':'';}
function alignmentMeasure(label){const row=measure(label),d=frame.contentDocument,w=frame.contentWindow;const nav=[...d.querySelectorAll('#tabs button')];for(const b of nav){const range=d.createRange();range.selectNodeContents(b);if(range.getClientRects().length>1)row.issues.push({kind:'wrappedNav',text:b.textContent});}
 for(const tr of d.querySelectorAll('tr')){const controls=[...tr.querySelectorAll('select,button')];if(controls.length>1){const rs=controls.map(rect);if(Math.max(...rs.map(r=>r.h))-Math.min(...rs.map(r=>r.h))>1)row.issues.push({kind:'unequalControlHeight',rect:rs});if(Math.max(...rs.map(r=>r.y+r.h/2))-Math.min(...rs.map(r=>r.y+r.h/2))>1)row.issues.push({kind:'unequalControlCenter',rect:rs});}}
 for(const group of d.querySelectorAll('.phase-actions')){const bs=[...group.children].map(e=>e.matches('button')?e:e.querySelector('button')).filter(Boolean),rs=bs.map(rect);for(let i=1;i<rs.length;i++)if(Math.abs(rs[i].y-rs[i-1].y)<2&&Math.abs(rs[i].h-rs[i-1].h)>1)row.issues.push({kind:'unequalActionHeight',rect:rs});}
 for(const group of d.querySelectorAll('.act,.phase-row,.path .pa')){const rs=[...group.querySelectorAll('button,select,input[type=number]')].map(rect);for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++)if(Math.abs(rs[i].y-rs[j].y)<3&&Math.abs(rs[i].h-rs[j].h)>1)row.issues.push({kind:'unequalFormControlHeight',rect:[rs[i],rs[j]]});}
 const cards=[...d.querySelectorAll('.home-offer')];for(let i=1;i<cards.length;i++){if(Math.abs(rect(cards[i]).y-rect(cards[i-1]).y)<2)for(const mode of ['self','private']){const a=rect(cards[i-1].querySelector('[data-mode="'+mode+'"]')),b=rect(cards[i].querySelector('[data-mode="'+mode+'"]'));if(Math.abs(a.y-b.y)>1)row.issues.push({kind:'unalignedHomeButtons',mode,rect:[a,b]});}}
 const modal=d.querySelector('#modal'),doc=d.querySelector('#doc');if(modal.classList.contains('on')){const cs=w.getComputedStyle(modal),mr=rect(modal),dr=rect(doc),hr=rect(doc.querySelector('.dh'));const top=mr.y+parseFloat(cs.paddingTop),bottom=mr.b-parseFloat(cs.paddingBottom);row.geometry={modal:mr,doc:dr,header:hr,safeTop:top,safeBottom:bottom,scrollTop:doc.scrollTop};if(dr.y<top-1||dr.b>bottom+1)row.issues.push({kind:'modalOutsideSafeArea',...row.geometry});if(doc.scrollTop>1||hr.y<dr.y-1||hr.b>dr.b+1)row.issues.push({kind:'headerInitiallyHidden',...row.geometry});}
 return row;}
document.querySelector('#safeMonthly').onclick=async()=>{await screen(390,844);await showSpecial('monthly');safeInsets(true);await settle();result.textContent=JSON.stringify(alignmentMeasure('monthly-safe-preview'),null,2);};
document.querySelector('#alignment').onclick=async()=>{if(running)return;running=true;const rows=[];try{await load(4);for(const [W,H]of [[320,568],[360,640],[390,844],[768,900],[900,800],[901,800],[1024,768],[1280,800]]){await screen(W,H);for(const tab of ['hr','business','fin','debt','projects']){frame.contentWindow.hideDoc();frame.contentDocument.querySelector('[data-t="'+tab+'"]').click();await settle();rows.push(alignmentMeasure(tab));}}
 for(const [W,H]of [[320,568],[360,640],[390,844],[390,640],[568,320]]){await screen(W,H);for(const k of ['monthly','review','ending_debt']){await showSpecial(k);safeInsets(true);await settle();rows.push(alignmentMeasure(k+'-safe'));const d=frame.contentDocument.querySelector('#doc');d.scrollTop=d.scrollHeight;frame.contentWindow.hideDoc();await showSpecial(k);await settle();rows.push(alignmentMeasure(k+'-reopened'));}safeInsets(false);}
 frame.contentWindow.hideDoc();result.textContent=JSON.stringify({checks:rows.length,failures:rows.filter(r=>r.issues.length),rows},null,2);}catch(e){result.textContent=JSON.stringify({error:e.stack});}finally{safeInsets(false);running=false;}};


document.querySelector('#dynamic').onclick=async()=>{const rows=[];await screen(390,844);await showSpecial('monthly');safeInsets(true);for(const [W,H]of [[390,640],[390,568],[390,844],[320,568],[390,844]]){await screen(W,H);rows.push(alignmentMeasure('monthly-resized'));}const d=frame.contentDocument,doc=d.querySelector('#doc'),button=d.querySelector('#mbOk');doc.scrollTop=doc.scrollHeight;await settle();const dr=rect(doc),br=rect(button);rows.push({label:'continue-at-bottom',screen:[390,844],issues:br.y<dr.y||br.b>dr.b?[{kind:'continueNotVisible',doc:dr,button:br}]:[],geometry:{doc:dr,button:br}});button.click();await settle();rows.push({label:'continue-works',issues:d.querySelector('#modal').classList.contains('on')?[{kind:'modalNotClosed'}]:[]});safeInsets(false);result.textContent=JSON.stringify({checks:rows.length,failures:rows.filter(r=>r.issues.length),rows},null,2);};

// This helper never starts automatically. Raw game storage is retained across a crash/reload.
const QA_BACKUP='yifang_releaseqa_original_v114';let qaActive=false,qaAllRunning=false;
function gameStorage(){return Object.fromEntries(Object.keys(localStorage).filter(k=>k.startsWith('yifang_')&&k!==QA_BACKUP).sort().map(k=>[k,localStorage.getItem(k)]));}
function restoreStorage(){const raw=localStorage.getItem(QA_BACKUP);if(!raw)return {byteEqual:true,backupFound:false};const original=JSON.parse(raw);for(const k of Object.keys(localStorage))if(k.startsWith('yifang_')&&k!==QA_BACKUP&&!Object.hasOwn(original,k))localStorage.removeItem(k);for(const [k,v]of Object.entries(original))localStorage.setItem(k,v);const equal=JSON.stringify(gameStorage())===JSON.stringify(original);if(!equal)throw Error('原进度恢复校验失败，备份已保留');localStorage.removeItem(QA_BACKUP);qaActive=false;return {byteEqual:true,backupFound:true,keysBefore:Object.keys(original).length,keysAfter:Object.keys(gameStorage()).length};}
function lockQA(){document.querySelectorAll('#toolbar button,#toolbar select').forEach(b=>{if(!['onlineStart','onlineRestore','onlineExport'].includes(b.id))b.disabled=!qaActive;});document.querySelector('#onlineStart').disabled=qaActive;}
for(const b of document.querySelectorAll('#toolbar button')){if(b.id.startsWith('online'))continue;const handler=b.onclick;if(!handler)continue;b.onclick=async e=>{if(!qaActive)return;if(qaAllRunning)return;const full=b.id==='all';if(full)qaAllRunning=true;try{if(full){const out={};for(const id of ['pages','dialogs','specials','compat']){await document.querySelector('#'+id).qaHandler();out[id]=JSON.parse(result.textContent);}const restored=restoreStorage();lockQA();frame.contentWindow.location.reload();result.textContent=JSON.stringify({...out,storageRestoration:restored},null,2);}else await handler(e);}catch(error){const info={error:String(error.stack||error)};if(full){try{info.storageRestoration=restoreStorage();lockQA();frame.contentWindow.location.reload();}catch(restoreError){info.restoreError=String(restoreError);}}result.textContent=JSON.stringify(info,null,2);}finally{if(full)qaAllRunning=false;}};b.qaHandler=handler;}
document.querySelector('#onlineStart').onclick=async()=>{if(qaActive||qaAllRunning)return;if(localStorage.getItem(QA_BACKUP))restoreStorage();localStorage.setItem(QA_BACKUP,JSON.stringify(gameStorage()));qaActive=true;lockQA();try{await load();result.textContent='已原文备份，验收样本已导入。完整验收结束后自动恢复；单项检查后请点“恢复原进度”。';}catch(e){const restored=restoreStorage();lockQA();result.textContent=JSON.stringify({error:String(e),storageRestoration:restored},null,2);}};
document.querySelector('#onlineRestore').onclick=()=>{if(running||qaAllRunning){result.textContent='检查仍在执行，完成后再恢复；完整验收会自动恢复。';return;}const restored=restoreStorage();lockQA();frame.contentWindow.location.reload();result.textContent=JSON.stringify({storageRestoration:restored},null,2);};
document.querySelector('#onlineExport').onclick=()=>{const raw=localStorage.getItem(QA_BACKUP)||JSON.stringify(gameStorage()),a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(raw);a.download='一方水土-线上验收前原始存储.json';a.click();};

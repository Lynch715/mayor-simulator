<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事件立项修复 · 隔离验收</title>
<style>body{font:14px system-ui;margin:12px;background:#eae8e1;color:#222}button,select{font:inherit;min-height:44px;margin:4px;padding:6px 12px}.controls{position:sticky;top:0;background:#eae8e1;z-index:10}iframe{display:block;width:390px;height:850px;border:1px solid #aaa;background:white}#wrap{overflow:auto;max-width:100%}pre{white-space:pre-wrap}</style>
<h1>事件立项修复 · 隔离验收</h1><p>使用真实事件弹窗，存储在内存中隔离；不读取或写入玩家存档。手机仅为视口模拟。</p>
<div class="controls"><button id="run" disabled>运行事件立项完整验收</button><button id="blocked" disabled>展示被拦截的地铁申报</button><button id="allowed" disabled>展示可立项的地铁申报</button><label>游戏宽度 <select id="width"><option>1280</option><option>640</option><option selected>390</option><option>320</option></select></label><strong id="status">加载中</strong></div>
<pre id="results"></pre><div id="wrap"><iframe id="game" title="事件立项隔离游戏"></iframe></div>
<script>
const frame=document.querySelector('#game'),out=document.querySelector('#results'),status=document.querySelector('#status'),run=code=>frame.contentWindow.eval(code),wait=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
let checks=0,failures=[];function assert(ok,label){checks++;if(!ok)throw Error(label);}
function sample(level=0){run(`queueBuild=qaRealQueue;newGame();${level?'initLevel('+level+',0);':''}S.cash=1000000;S.env=90;S.liv=70;S.f.power+=100;S.planZone='heavy';S.tab='over';Math.random=()=>.8;$('#cover').style.display='none';hideDoc();renderAll();`);}
function show(id){run(`showEvent(EV.find(e=>e.id==='${id}'),()=>{window.qaDone=true;renderAll()});window.qaDone=false;`);}
function doc(){return frame.contentDocument;}
function choice(id){return run(`EV.find(e=>e.id==='${id}').opts.findIndex(o=>o.fx?.q)`);}
function button(id){return doc().querySelector(`#doc [data-i="${choice(id)}"]`);}
function snapshot(){return run('JSON.stringify({...S,log:[],logSeq:0})');}
function geometry(label){const modal=doc().querySelector('#doc'),r=modal.getBoundingClientRect();assert(r.left>=-1&&r.right<=frame.clientWidth+1,label+' 弹窗横向边界');for(const b of modal.querySelectorAll('button')){const br=b.getBoundingClientRect();assert(br.height>=40,label+' 按钮触控高度');}assert(doc().documentElement.scrollWidth<=frame.clientWidth+1,label+' 页面横向边界');}
document.querySelector('#width').onchange=e=>{frame.style.width=e.target.value+'px';run('fitTabs()');};
document.querySelector('#blocked').onclick=()=>{sample(2);run("landTake(landFree(),'any');landAdd(FAC.road.land*S.lsc*.35,'com')");show('metro');status.textContent='土地只够一项，申报已拦截';};
document.querySelector('#allowed').onclick=()=>{sample(2);show('metro');status.textContent='条件齐全，可一次立项两项';};
document.querySelector('#run').onclick=async()=>{
 checks=0;failures=[];status.textContent='验收中';document.querySelector('#run').disabled=true;
 try{
 for(const width of [1280,640,390,320]){frame.style.width=width+'px';await wait();
  const events=run('EV.concat(PET).filter(e=>e.opts.some(o=>o.fx?.q)).map(e=>({id:e.id,level:e.lv?.[0]||0}))');
  for(const ev of events){sample(ev.level);run("landTake(landFree(),'any')");show(ev.id);const before=snapshot(),b=button(ev.id);assert(b.disabled,width+' '+ev.id+' 缺地选项不可用');assert(b.textContent.includes('土地不足'),width+' '+ev.id+' 显示缺地原因');b.click();assert(snapshot()===before,width+' '+ev.id+' 未扣款或发奖励');assert(Array.from(doc().querySelectorAll('#doc .opt')).some(b=>!b.disabled),width+' '+ev.id+' 仍有替代选项');geometry(width+' '+ev.id);}
  sample(1);run("landTake(landFree(),'any')");show('newcity3');const deferredCash=run('S.cash'),deferredPros=run('S.pros');const deferred=Array.from(doc().querySelectorAll('#doc .opt')).find(b=>b.textContent.includes('下月再议'));assert(!!deferred&&!deferred.disabled,'新城有下月再议入口');deferred.click();assert(run('S.cash')===deferredCash,'新城暂缓不扣款');assert(run('S.pros')===deferredPros,'新城暂缓不加指标');assert(run('S.build.length')===0,'新城暂缓不建项');assert(run('S.sched.filter(s=>s.id==="newcity3"&&s.m===0).length')===1,'新城重新排入下月一次');assert(run('window.qaDone'),'新城原事件流程可继续');
  sample(1);run("S.planZone='eco'");show('land_cheap3');assert(button('land_cheap3').disabled,'保护区工业申报被拦截');assert(button('land_cheap3').textContent.includes('片区'),'保护区说明可见');
  sample(2);run("landTake(landFree(),'any');landAdd(FAC.road.land*S.lsc*.35,'com')");show('metro');let before=snapshot();assert(button('metro').disabled,'地铁两项土地合计不足被拦截');button('metro').click();assert(snapshot()===before,'地铁未部分建项或扣款');assert(!run('S.sched.some(s=>s.id==="metro2")'),'未排后续事件');
  sample(2);show('metro');assert(!button('metro').disabled,'条件齐全允许申报');const cash=run('S.cash'),sc=run('S.sc');button('metro').click();assert(run('S.build.filter(b=>b.id==="road").length')===2,'地铁一次建齐两项');assert(run('S.cash')===cash-1500*sc,'按原额度扣费一次');assert(run('S.sched.filter(s=>s.id==="metro2").length')===1,'后续安排一次');assert(run('S.once.metro')===1,'成功后才标记已办理');assert(run('window.qaDone'),'完成原回调');assert(!doc().querySelector('#modal.on'),'完成后关闭弹窗');run('save();load();renderAll()');assert(run('S.build.length')===2,'保存读取不重复建项');assert(run('S.sched.filter(s=>s.id==="metro2").length')===1,'保存读取不重复后续');
  sample(1);show('land_cheap3');const starting=run('S.cash');button('land_cheap3').click();assert(run('S.build.filter(b=>b.id==="fzone").length')===1,'工业事件成功建项');assert(run('S.cash')===starting-600,'工业事件配套费一次扣除');
  sample(2);show('metro');before=snapshot();run("window.qaCalls=0;queueBuild=id=>{if(++window.qaCalls===2)return '模拟登记失败';return qaRealQueue(id)}");button('metro').click();assert(snapshot()===before,'意外失败撤回整批建项');assert(!run('S.once.metro'),'意外失败不标记一次事件');assert(!run('window.qaDone'),'意外失败不推进后续流程');assert(!!doc().querySelector('#modal.on'),'保留弹窗供重新选择');run('queueBuild=qaRealQueue');
 }
 }catch(error){failures.push(error.stack);}
 run('queueBuild=qaRealQueue');frame.style.width='390px';document.querySelector('#width').value='390';sample(2);run("landTake(landFree(),'any');landAdd(FAC.road.land*S.lsc*.35,'com')");show('metro');await wait();
 const result={checks,failures,isolatedStorage:true,physicalDevice:false,scope:'1280 / 640 / 390 / 320px; 10 actual event dialogs, blocked costs/rewards, full metro construction, save/load, and injected registration failure'};out.textContent=JSON.stringify(result,null,2);status.textContent=failures.length?'验收失败':'全部通过';document.querySelector('#run').disabled=false;
};
(async()=>{let html=await(await fetch('../../index.html',{cache:'no-store'})).text();const shim=`<script>const qaStore=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>qaStore.get(k)||null,setItem:(k,v)=>qaStore.set(k,String(v)),removeItem:k=>qaStore.delete(k)}});window.addEventListener('error',e=>parent.document.querySelector('#results').textContent+='\\n'+e.message);<\/script>`;html=html.replace('<head>','<head><base href="'+new URL('../../',location.href)+'">').replace('<script>',shim+'<script>');frame.onload=()=>{run('window.qaRealQueue=queueBuild');document.querySelectorAll('.controls button').forEach(b=>b.disabled=false);status.textContent='隔离环境就绪';const preview=new URLSearchParams(location.search).get('preview');if(preview){document.body.style.margin='0';document.querySelectorAll('body>h1,body>p,.controls,#results').forEach(e=>e.style.display='none');frame.style.cssText='width:100%;height:100vh;border:0';sample(2);if(preview==='blocked')run("landTake(landFree(),'any');landAdd(FAC.road.land*S.lsc*.35,'com')");show('metro');}};frame.srcdoc=html;})();
</script></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F2EE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一方水土">
<meta name="application-name" content="一方水土">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icon/icon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="assets/icon/icon-120.png">
<title>一方水土</title>
<style>
:root{
  --paper:#F3F2EE;--paper2:#EAE8E1;--ink:#22252A;--ink2:#5A5E66;--ink3:#8B8F98;
  --red:#B4231C;--red2:#8E1A15;--blue:#234C86;--blue2:#1B3C6B;
  --green:#2E6B4A;--gold:#9A7A2A;--line:#C9C6BC;--line2:#DDDBD3;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body{min-height:100%;touch-action:manipulation;overscroll-behavior-y:none;-webkit-tap-highlight-color:rgba(35,76,134,.12)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:2px}
button:hover{border-color:var(--ink2)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary:hover{background:var(--blue2)}
button.danger{color:var(--red);border-color:var(--red)}
button.sm{padding:3px 10px;font-size:13px}
input[type=range]{width:100%;accent-color:var(--blue)}
select,input[type=number]{font-family:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--ink3)}
h1,h2,h3{font-family:var(--serif);font-weight:700}

/* 红头 */
#head{background:#fff;border-bottom:1px solid var(--line)}
#head .inner{max-width:1120px;margin:0 auto;padding:14px 20px 0}
#head .redtitle{font-family:var(--serif);color:var(--red);font-size:28px;letter-spacing:.12em;font-weight:700;text-align:center;line-height:1.25}
#head .redtitle small{display:block;font-size:13px;letter-spacing:.3em;color:var(--red);font-weight:400;margin-top:2px}
#head .rule{height:0;border-top:2px solid var(--red);border-bottom:1px solid var(--red);margin:10px 0 0}
#head .meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;padding:8px 0 10px;font-size:14px;color:var(--ink2)}
#head .meta b{color:var(--ink);font-weight:600}

/* 指标条 */
#stats{max-width:1120px;margin:14px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line2);padding:9px 12px;position:relative}
.stat .l{font-size:12px;color:var(--ink3)}
.stat .v{font-size:20px;font-weight:600;line-height:1.2;margin-top:2px}
.stat .d{font-size:12px;margin-top:1px}
.stat .bar{height:3px;background:var(--paper2);margin-top:6px}
.stat .bar i{display:block;height:100%;background:var(--blue)}
.stat.warn .bar i{background:var(--red)}
.stat.warn .v{color:var(--red)}

/* 主体 */
#main{max-width:1120px;margin:14px auto;padding:0 20px;display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
#tabs{display:flex;border-bottom:1px solid var(--line);background:#fff}
#tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:10px 18px;border-radius:0;color:var(--ink2)}
#tabs button.on{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
#panel{background:#fff;border:1px solid var(--line2);border-top:0;padding:18px 20px;min-height:420px}
#side{position:sticky;top:12px}
.card{background:#fff;border:1px solid var(--line2);padding:14px 16px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
#nextbtn{width:100%;padding:12px;font-size:17px;font-family:var(--serif);letter-spacing:.2em}
#nexthint{margin:8px 0 0}
#log{max-height:300px;overflow:auto;font-size:13px;line-height:1.55}
#log div{padding:4px 0;border-bottom:1px dashed var(--line2)}
#log .t{color:var(--ink3);margin-right:6px;font-variant-numeric:tabular-nums}
#log .bad{color:var(--red)}#log .good{color:var(--green)}#log .sys{color:var(--blue)}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:13px;background:var(--paper)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
.sec{margin-bottom:22px}
.sec h2{font-size:17px;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--red)}
.hint{font-size:13px;color:var(--ink2);margin:6px 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fac{border:1px solid var(--line2);padding:10px 12px;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.fac svg{width:34px;height:34px}
.fac .n{font-weight:600}
.fac .i{font-size:12px;color:var(--ink2)}
.fac .cov{font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:2px;color:var(--ink2);margin-left:6px;vertical-align:1px}
.tag.red{color:var(--red);border-color:var(--red)}
.tag.blue{color:var(--blue);border-color:var(--blue)}
.tag.green{color:var(--green);border-color:var(--green)}
.gauge{height:8px;background:var(--paper2);position:relative;margin:4px 0}
.gauge i{display:block;height:100%;background:var(--blue)}
.gauge i.warn{background:var(--red)}
.gauge .mk{position:absolute;top:-3px;width:1px;height:14px;background:var(--red)}

.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.subtabs button{padding:6px 12px;font-size:13px;border-radius:999px;background:var(--paper);color:var(--ink2)}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subtabs button .c{font-size:11px;margin-left:5px;opacity:.75;font-variant-numeric:tabular-nums}
.fac.locked{opacity:.55}

/* 债务页 */
.debt-top{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.debt-top b{font-size:28px;line-height:1}
.debt-top span{font-size:13px;line-height:1.45}
.act{display:flex;align-items:center;gap:8px}
.act input[type=number]{flex:1 1 80px;min-width:0;width:auto;max-width:160px}
.act select{flex:0 0 auto}
.paths .path{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.paths .path:last-child{border-bottom:0}
.path .pt{flex:1 1 auto;min-width:0}
.path .pt .muted{font-size:12px}
.path .pa{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.path .pa input[type=number]{width:110px}
@media (max-width:640px){
  .act{flex-wrap:nowrap}
  .act input[type=number]{max-width:none}
  .act select{padding:7px 4px}
  .paths .path{flex-direction:column;align-items:stretch;gap:8px}
  .path .pa{justify-content:flex-end}
  .path .pa input[type=number]{flex:1 1 auto;width:auto;min-width:0}
  .path .pa button{flex:0 0 auto;min-width:72px}
  .debt-top b{font-size:26px}
}

/* 月度简报 */
.doc .body.brief{white-space:normal}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kv div{background:var(--paper);border:1px solid var(--line2);padding:7px 10px}
.kv i{display:block;font-style:normal;font-size:12px;color:var(--ink3)}
.kv b{font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:13px}
.chip{border:1px solid var(--line);padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.chip.up{color:var(--green);border-color:var(--green)}.chip.down{color:var(--red);border-color:var(--red)}
.news .nt{font-size:12px;color:var(--ink3);letter-spacing:.1em;margin-bottom:4px}
.news div+div{margin-top:3px}
.news .bad{color:var(--red)}.news .good{color:var(--green)}.news .sys{color:var(--blue)}
.brief-opt{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink3);line-height:1.5;cursor:pointer}
.brief-opt input{margin-top:3px;flex:0 0 auto}
#mtoast{position:fixed;left:50%;top:10px;transform:translate(-50%,-140%);max-width:min(92vw,640px);background:rgba(34,37,42,.94);color:#fff;font-size:13px;padding:9px 16px;border-radius:4px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .25s ease;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mtoast.on{transform:translate(-50%,0)}
@media (max-width:640px){.kv{grid-template-columns:repeat(2,1fr);gap:6px}.kv b{font-size:15px}#mtoast{top:calc(8px + env(safe-area-inset-top));font-size:12px;padding:8px 12px}}

/* 呈批件弹窗 */
#modal{position:fixed;inset:0;background:rgba(30,32,36,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
.doc{background:#fff;max-width:640px;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.doc .dh{padding:18px 26px 12px;border-bottom:1px solid var(--line2)}
.doc .kind{font-size:12px;color:var(--ink3);letter-spacing:.2em}
.doc h2{font-size:21px;margin-top:4px;line-height:1.35}
.doc .body{padding:18px 26px;font-size:15px;line-height:1.85;white-space:pre-line}
.doc .body p{margin-bottom:10px}
.doc .opts{padding:0 26px 22px;display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:11px 14px;border:1px solid var(--line);background:#fff;line-height:1.5;display:block;width:100%}
.opt:hover{border-color:var(--blue);background:#F7F9FC}
.opt .ot{font-weight:600}
.opt .on{font-size:13px;color:var(--ink2);display:block;margin-top:2px}
.opt.grey{border-left:3px solid var(--red)}
.doc.notice .body{font-family:var(--serif)}
.seal{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:var(--serif);font-size:13px;padding:2px 8px;transform:rotate(-8deg);opacity:.85;margin-top:8px;letter-spacing:.1em}
.grade{font-family:var(--serif);font-size:44px;color:var(--red);line-height:1}

/* 美术资产 */
.art{width:100%;aspect-ratio:3/1;overflow:hidden;background:var(--paper2);position:relative}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.wide{aspect-ratio:2/1}
.art.banner{border:1px solid var(--line2);margin-bottom:16px}
.doc .art{border-bottom:1px solid var(--line2)}
.doc .art:after{content:"";position:absolute;inset:0;box-shadow:inset 0 -24px 24px -24px rgba(34,37,42,.18);pointer-events:none}
.doc .body.hasp{display:grid;grid-template-columns:128px 1fr;gap:6px 18px;align-items:start}
.doc .portrait{aspect-ratio:3/4;overflow:hidden;position:sticky;top:0}
.doc .portrait img{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block}
.doc .portrait:after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:1px;background:var(--line)}

/* 开始/结局 */
#cover{position:fixed;inset:0;background:var(--paper) url(assets/cover.webp) center/cover no-repeat;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#cover:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(243,242,238,.15),rgba(243,242,238,.55));pointer-events:none}
#cover .box{position:relative;max-width:560px;width:100%;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:36px 40px;box-shadow:0 24px 60px rgba(34,37,42,.25)}
#cover h1{font-size:44px;letter-spacing:.3em;color:var(--red);text-align:center;line-height:1.2}
#cover .sub{text-align:center;color:var(--ink2);margin:6px 0 22px;letter-spacing:.15em;font-size:14px}
#cover p{margin-bottom:10px;font-size:14px;line-height:1.8}
#cover .rule{border-top:2px solid var(--red);border-bottom:1px solid var(--red);height:0;margin:0 0 18px}
#cover .foot{font-size:12px;color:var(--ink3);margin-top:18px;line-height:1.7}
.resume li{padding:5px 0;border-bottom:1px dashed var(--line2);font-size:14px}
.resume .y{color:var(--ink3);margin-right:8px;font-variant-numeric:tabular-nums}
.file li{padding:6px 0;border-bottom:1px dashed var(--line2);font-size:14px}
.file .sev{color:var(--red);font-size:12px;margin-left:6px}
.file .exp{color:var(--ink3);font-size:12px;margin-left:6px}

@media (max-width:900px){
  #main{grid-template-columns:1fr}
  #side{position:static}
  #stats{grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px}
  #main{padding:0 12px}
  #head .inner{padding:10px 12px 0}
  #head .redtitle{font-size:22px}
  #tabs{overflow-x:auto}
  #tabs button{padding:10px 12px;white-space:nowrap}
  #panel{padding:14px 12px}
  .grid2{grid-template-columns:1fr}
  .doc .dh,.doc .body,.doc .opts{padding-left:16px;padding-right:16px}
  .doc .body.hasp{grid-template-columns:88px 1fr;gap:6px 12px}
  .art.banner{margin-bottom:12px}
}

/* ===== 移动端（竖屏）适配 ===== */
@media (max-width:640px){
  body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  #head .inner{padding:9px 12px 0}
  #head .redtitle{font-size:20px;letter-spacing:.08em}
  #head .redtitle small{font-size:11px;letter-spacing:.2em;margin-top:1px}
  #head .meta{justify-content:flex-start;gap:3px 14px;font-size:12.5px;padding:6px 0 8px}
  #stats{grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px;margin-top:10px}
  .stat{padding:7px 8px}
  .stat .l{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v{font-size:17px}
  .stat .d{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{margin:10px auto;padding:0 12px;gap:10px}
  #tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs button{padding:10px 13px;white-space:nowrap;flex:0 0 auto}
  #panel{padding:14px 12px;min-height:0}
  .card{padding:12px 13px}
  .sec{margin-bottom:18px}
  .sec h2{font-size:16px}
  .hint{font-size:12.5px}
  table{font-size:13px}
  th,td{padding:6px 5px}
  th{font-size:12px}
  .grid2{grid-template-columns:1fr;gap:10px}
  .fac{grid-template-columns:30px 1fr;gap:6px 10px;padding:10px}
  .fac svg{width:28px;height:28px}
  .fac>button{grid-column:1/-1;width:100%;padding:9px;margin-top:2px}
  .row{gap:8px}
  .row input[type=number]{max-width:42vw}
  select,input[type=number]{font-size:16px;padding:7px 8px}
  button{padding:8px 14px}
  button.sm{padding:7px 12px;font-size:13px}
  #log{max-height:220px}
  #modal{padding:10px 10px calc(10px + env(safe-area-inset-bottom));align-items:flex-end}
  /* 弹窗：正文内部滚动，选项按钮常驻可见，不会被划出屏幕 */
  .doc{max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden}
  .doc>.art,.doc .dh{flex:0 0 auto}
  .doc .body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
  .doc .opts{flex:0 0 auto;max-height:46vh;overflow-y:auto;border-top:1px solid var(--line2);padding-top:12px}
  .doc .dh{padding:14px 16px 10px}
  .doc h2{font-size:19px}
  .doc .body{padding:14px 16px;font-size:15px;line-height:1.8}
  .doc .opts{padding:0 16px 18px;gap:9px}
  .opt{padding:12px 13px;min-height:48px}
  .doc .body.hasp{grid-template-columns:82px 1fr;gap:6px 12px}
  .grade{font-size:38px}
  .art.banner{margin-bottom:12px}
  #cover{align-items:flex-start;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
  #cover .box{padding:24px 18px;margin:auto 0}
  #cover h1{font-size:clamp(28px,9.5vw,44px);letter-spacing:.22em;text-indent:.22em}
  #cover .sub{font-size:13px;margin:6px 0 18px;letter-spacing:.1em}
  #cover p{font-size:14px;line-height:1.75}
  #cover .foot{font-size:11.5px}
  #cover .row{gap:8px}
  #cover .row button{padding:11px 18px!important;flex:1 1 40%}
  /* 常驻「下月」条：避免每月都要滚到页面底部 */
  #side .card.next{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;border:0;border-top:1px solid var(--line);background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 -4px 18px rgba(34,37,42,.12);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
  #side .card.next #nextbtn{width:auto;flex:0 0 auto;padding:11px 20px;font-size:16px;letter-spacing:.15em}
  #side .card.next #nexthint{margin:0;flex:1 1 auto;font-size:12px;line-height:1.35;max-height:2.7em;overflow:hidden}
}
@media (max-width:360px){
  #stats{grid-template-columns:repeat(2,1fr)}
  #head .redtitle{font-size:18px}
  #head .meta{font-size:12px}
  #tabs button{padding:10px 10px;font-size:14px}
  .doc .body.hasp{grid-template-columns:70px 1fr}
  .row input[type=number]{max-width:38vw}
}
@media (prefers-reduced-motion:no-preference){
  #modal.on .doc{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="cover">
  <div class="box">
    <h1>一方水土</h1>
    <div class="sub">地方主政者生涯模拟</div>
    <div class="rule"></div>
    <p>你三十二岁，刚被任命为青石镇镇长。镇财政所的账本已经放在桌上：转移支付撑着工资，税收撑不起一条像样的路，储备地倒还剩几百亩。</p>
    <p>往后二十八年，你会在这个体系里一级一级往上走，或者走不上去。每个月都要决定钱往哪投、地卖不卖、债发不发、编制招多少。上面看考核，下面看日子。</p>
    <p>三保优先序、隐性债务率、专项债白名单、化债任务书——这些不是背景板，是每个月真会卡住你的东西。</p>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="primary" id="btnNew" style="padding:10px 28px">到任就职</button>
      <button id="btnLoad" style="padding:10px 20px">读取存档</button>
    </div>
    <div class="foot">架空背景，所有地名、人物、事件均为虚构。游戏内任何伸手的路径都会走向失败结局，这不是难度设计，是规则。</div>
  </div>

/* ========== 引擎 ========== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
let S=null;

function newGame(){
  S={lvl:0,year:1,month:1,age:32,tenure:0,cash:0,reserve:0,reserveRate:2,
     pop:0,pros:38,liv:42,sat:50,env:58,rep:50,unity:60,
     landTotal:0,land:0,landSold:0,housing:20,f:{},ind:[],build:[],
     cq:[],platform:0,sb:[],sbUnspent:0,sbIdle:0,sbYear:0,task:null,frozen:false,
     staff:0,quota:0,recruitThisYear:0,reformDone:false,
     file:[],sanctions:0,accRisk:0,flags:{},taxcut:0,nosell:0,collect:0,
     sched:[],once:{},merit:0,ratings:[],dRun:0,gaps:{wage:0,ops:0,live:0},sanbaoYr:0,accidentsYr:0,
     interestMiss:0,log:[],resume:[],monthly:null,expMult:1,over:null,tab:'over',grantYr:0,hist:[],built:0,phase:'work',retY:0,ppp:0};
  initLevel(0,0);
  logIt('到任。青石镇，三万四千人，一个资源枯竭的老矿镇。','sys');
  S.resume.push({y:1,t:'任青石镇镇长'});
}
function closeLevel(){if(S.lvl===undefined)return;S.hist.push({lvl:S.lvl,city:LV[S.lvl].city,years:S.tenure,built:S.built,hdr:Math.round(hdr()),grades:S.ratings.slice(-S.tenure).join(''),sat:Math.round(S.sat)});}
function initLevel(lvl,carryMerit){
  if(lvl>0)closeLevel();
  const L=LV[lvl];S.lvl=lvl;S.sc=L.sc;S.lsc=L.land/600;S.tenure=0;S.merit=carryMerit;
  S.pop=L.pop;S.landTotal=L.land;S.land=L.land*(lvl===0?1:0.55);S.landSold=L.land*(lvl===0?0:0.3);S.housing=lvl===0?20:45;
  S.cash=L.transfer*(lvl===0?1.5:2.5);S.reserve=0;
  const frac={road:.6,school:.6,hosp:.45,power:.7,water:.75,sewage:.25,park:.3,social:.35,elder:.2,nursery:.25,clinic:.25,market:.3,gas:.35,busdepot:.3,bridge:.3,garbage:.2,culture:.15};
  const base0=['road','school','hosp','power','water','social','elder'];
  S.f={};for(const k of FACORDER)S.f[k]=0;
  for(const k in frac){S.f[k]=Math.max(lvl===0&&base0.includes(k)?1:0,Math.round(frac[k]*L.pop/(FAC[k].cap*L.sc)));}
  S.f.factory=lvl===0?0:Math.round(1.5*lvl);S.ind=[];
  const nInd=lvl===0?0:Math.round(0.35*L.pop/(FAC.logi.jobs*L.sc*2.2));
  for(let i=0;i<nInd;i++)S.ind.push({id:i%3===2&&lvl>=2?'tech':'logi',age:60});
  S.f.logi=S.ind.filter(x=>x.id==='logi').length;S.f.tour=0;S.f.tech=S.ind.filter(x=>x.id==='tech').length;S.f.aero=0;
  S.build=[];S.built=0;S.ppp=0;S.staff=L.staff;S.quota=Math.round(L.staff*1.05);S.recruitThisYear=0;S.reformDone=false;
  S.cq=[];S.platform=0;S.sb=[];S.sbUnspent=0;S.sbIdle=0;S.sbYear=0;S.task=null;S.frozen=false;
  if(lvl>0){const inc=annualIncome();const debt=inc*(0.35+0.08*lvl);S.cq.push({amt:debt*0.6,rate:7,left:30,term:36});S.cq.push({amt:debt*0.4,rate:7,left:54,term:60});}
  S.pros=lvl===0?36:44+lvl*3;S.liv=lvl===0?42:50;S.sat=52;S.env=lvl===0?58:52-lvl*2;
  S.taxcut=0;S.nosell=0;S.collect=0;S.accRisk=0;S.gaps={wage:0,ops:0,live:0};S.sanbaoYr=0;S.accidentsYr=0;S.interestMiss=0;S.dRun=0;S.grantYr=0;
  S.sched=S.sched.filter(x=>x.id.startsWith('p_')===false);
  S.monthly=null;
}
/* ---- 计算 ---- */
function cov(id){return clamp((S.f[id]||0)*FAC[id].cap*S.sc/S.pop,0,1.4);}
function jobs(){let j=S.f.factory*0.6;for(const x of S.ind){j+=FAC[x.id].jobs*Math.min(1,x.age/FAC[x.id].ramp);}return clamp(j*S.sc/(S.pop*0.45),0,1.3);}
function gdp(){return S.pop*(1.5+S.pros/25)*0.6;}
function eff(){return clamp(S.staff/staffNeed(),0.6,1.1);}
function staffNeed(){return LV[S.lvl].staff/LV[S.lvl].pop*S.pop;}
function wageBill(){return S.staff*LV[S.lvl].wage*(1+0.015*S.year);}
function opsBill(){let m=S.ppp||0;for(const k of FACORDER){if(S.f[k])m+=S.f[k]*FAC[k].maint*S.sc;}m+=S.f.factory*0;const admin=LV[S.lvl].transfer*0.12*(S.reformDone?0.9:1);return (m+admin)*(0.9+0.2*eff());}
function liveBill(){return S.pop*8.5*(1+0.01*S.year)*(1+0.2*S.lvl);}
function taxCommerce(){return S.pop*12*(0.4+S.pros/100)*eff();}
function taxIndustry(){let t=S.f.factory*45*S.sc;for(const x of S.ind){t+=FAC[x.id].tax*S.sc*Math.min(1,x.age/FAC[x.id].ramp);}return t*(S.taxcut>0?0.6:1);}
function transferPay(){return LV[S.lvl].transfer*(1+(S.lvl>=2?0.005:0.012)*S.year);}
function monthIncome(){return taxCommerce()+taxIndustry()+transferPay();}
function annualIncome(){return monthIncome()*12;}
function cqOut(){return S.cq.reduce((a,b)=>a+b.amt,0);}
function sbOut(){return S.sb.reduce((a,b)=>a+b.amt,0);}
function hdr(){return cqOut()/annualIncome()*100;}
function debtRatio(){return (cqOut()+sbOut()+S.platform)/annualIncome()*100;}
function cqQuota(){return Math.max(0,annualIncome()*LV[S.lvl].cq-cqOut());}
function sbQuota(){return S.lvl<1?0:Math.max(0,gdp()*10000*0.03-S.sbYear);}
function wlCostLeft(){return S.build.filter(b=>b.wl).reduce((a,b)=>a+(b.cost-b.paid),0);}
function tension(){const exp=wageBill()+opsBill()+liveBill();const r=exp/monthIncome()*100;return clamp(0.45*hdr()+0.25*debtRatio()+15*Math.min(2,S.sanbaoYr)+0.2*Math.max(0,r-100),0,100);}
function landPrice(){return LV[S.lvl].landPrice*(0.7+S.pros/100)*(1+0.25*S.housing/100);}
Object.defineProperties(S||{},{});
function getters(){S.hdr=hdr();S.indCount=S.ind.length+S.f.factory;S.landPct=S.land/S.landTotal;}
function fmt(v){const a=Math.abs(v);if(a>=1e4)return (v/1e4).toFixed(a>=1e5?0:1)+'亿';return Math.round(v)+'万';}
function fmtPop(v){return v>=1000?(v/100).toFixed(0)+'百万':v.toFixed(1)+'万';}
function logIt(t,c){S.logSeq=(S.logSeq||0)+1;S.log.unshift({y:S.year,m:S.month,t,c:c||'',q:S.logSeq});if(S.log.length>200)S.log.length=200;}

/* ---- 动作 ---- */
function queueBuild(id){const F=FAC[id];if(F.lvl!==undefined&&S.lvl<F.lvl)return '等级不够';
  if(F.needLiv&&S.liv<F.needLiv)return '宜居度不足'+F.needLiv;
  if(F.ind&&cov('power')<0.5)return '电厂覆盖不足，先建电厂';
  const land=F.land*S.lsc*0.35;if(S.land<land)return '储备土地不足';
  S.land-=land;S.build.push({id,paid:0,cost:F.cost*S.sc*(1+0.02*S.year),months:F.months,left:F.months,wl:F.wl});
  logIt('立项：'+F.n+'，总投资'+fmt(F.cost*S.sc*(1+0.02*S.year))+'，工期'+F.months+'个月。');return null;}
function cancelBuild(i){const b=S.build[i];if(!b)return;S.land+=FAC[b.id].land*S.lsc*0.35*0.5;S.build.splice(i,1);logIt('取消项目：'+FAC[b.id].n+'，已付资金不退。','bad');}
function sellLand(mu){if(S.nosell>0)return '限购期内暂停供地';mu=Math.min(mu,S.land);if(mu<=0)return '没有可供地块';
  const p=landPrice()*mu;S.cash+=p;S.land-=mu;S.landSold+=mu;S.housing=clamp(S.housing+mu/S.landTotal*120,0,100);
  logIt('出让土地'+Math.round(mu)+'亩，收入'+fmt(p)+'。');return null;}
function issueCQ(amt,term){if(S.frozen)return '新增融资已冻结';if(amt<=0||amt>cqQuota())return '超出额度';
  S.cq.push({amt,rate:7,left:term,term});S.cash+=amt;logIt('发行城投债'+fmt(amt)+'，'+term/12+'年期，年利率7%。','sys');return null;}
function issueSB(amt,term){if(S.frozen)return '新增融资已冻结';if(S.lvl<1)return '县级以上才能申报';if(wlCostLeft()<=0)return '没有在建的白名单项目';
  amt=Math.min(amt,sbQuota(),wlCostLeft()-S.sbUnspent);if(amt<=0)return '额度不足或项目资金已覆盖';
  S.sb.push({amt,rate:2.8,left:term,term});S.cash+=amt;S.sbUnspent+=amt;S.sbYear+=amt;logIt('专项债获批'+fmt(amt)+'，'+term/12+'年期，年利率2.8%。','sys');return null;}
function repayCQ(amt){amt=Math.min(amt,S.cash+S.reserve,cqOut());if(amt<=0)return '没有可用资金';
  let fromRes=Math.min(S.reserve,amt);S.reserve-=fromRes;S.cash-=(amt-fromRes);let left=amt;
  S.cq.sort((a,b)=>a.left-b.left);for(const b of S.cq){const x=Math.min(b.amt,left);b.amt-=x;left-=x;if(left<=0)break;}
  S.cq=S.cq.filter(b=>b.amt>1);logIt('财政偿还城投债本金'+fmt(amt)+'。','good');return null;}
function revitalize(){if(S.flags['rev'+S.year])return '今年已盘活过';const mu=Math.min(S.land,80*S.lsc);if(mu<=0)return '没有可盘活资产';
  const v=landPrice()*mu*0.8;S.land-=mu;S.landSold+=mu*0.5;S.flags['rev'+S.year]=1;let left=v;S.cq.sort((a,b)=>a.left-b.left);
  for(const b of S.cq){const x=Math.min(b.amt,left);b.amt-=x;left-=x;if(left<=0)break;}S.cq=S.cq.filter(b=>b.amt>1);S.cash+=left;S.rep+=1;
  logIt('盘活存量资产偿债'+fmt(v-left)+'。','good');return null;}
function collectStart(){if(S.collect>0)return '正在执行';S.collect=12;logIt('启动归集企业税收偿债，为期一年。','sys');return null;}
function extendCQ(){if(!S.cq.length)return '没有城投债';for(const b of S.cq){b.left+=24;b.rate+=1;}S.rep-=4;S.unity-=1;logIt('城投债展期重组：期限延长两年，利率上调一个点。声誉受损。','bad');return null;}
function platformTransform(){if(S.lvl<1)return '县级以上才能操作';if(S.flags['plat'+S.lvl])return '本级已转型过';let x=cqOut()*0.2;
  for(const b of S.cq)b.amt*=0.8;S.platform+=x;S.flags['plat'+S.lvl]=1;logIt('城投平台转型：'+fmt(x)+'城投债转为经营性债务。','sys');return null;}
function recruit(n){n=Math.round(n);if(n<=0)return '';if(S.recruitThisYear>0)return '今年已招录';const room=S.quota-S.staff;if(n>room)return '超出核定编制';
  const cap=Math.round(S.staff*0.08);S.recruitThisYear=n;
  if(n>cap){const got=Math.round(cap+(n-cap)*0.5);S.staff+=got;S.sat-=3;S.rep-=2;logIt('招录'+n+'人，报录比超出承载，实际到岗'+got+'人，引发舆情。','bad');}
  else{S.staff+=n;logIt('招录事业编'+n+'人。');}return null;}
function cutStaff(n){n=Math.round(n);if(n<=0)return '';if(n>S.staff*0.1)return '一次最多缩编一成';S.staff-=n;S.unity-=3;S.sat-=1;logIt('缩减编制'+n+'人。班子有意见。','bad');return null;}
function reform(){if(S.reformDone)return '本级已完成机构改革';const c=LV[S.lvl].transfer*1.5;if(S.cash<c)return '需要'+fmt(c);S.cash-=c;S.reformDone=true;S.unity-=4;logIt('机构改革完成，行政运转成本下降。','sys');return null;}

/* ---- 效果应用 ---- */
function applyFx(fx){if(!fx)return;
  if(fx.cash)S.cash+=fx.cash*S.sc;if(fx.cashLand)S.cash+=40*S.lsc*landPrice()*fx.cashLand;
  if(fx.sat)S.sat=clamp(S.sat+fx.sat,0,100);if(fx.env)S.env=clamp(S.env+fx.env,0,100);if(fx.pros)S.pros=clamp(S.pros+fx.pros,0,100);
  if(fx.liv)S.liv=clamp(S.liv+fx.liv,0,100);if(fx.rep)S.rep=clamp(S.rep+fx.rep,0,100);if(fx.unity)S.unity=clamp(S.unity+fx.unity,0,100);
  if(fx.pop)S.pop*=1+fx.pop/100;if(fx.land){S.land=Math.max(0,S.land+fx.land*S.lsc);if(fx.land>0)S.landTotal+=fx.land*S.lsc;}
  if(fx.fac){if(fx.fac.id==='factory')S.f.factory+=fx.fac.n;else S.f[fx.fac.id]=Math.max(0,(S.f[fx.fac.id]||0)+fx.fac.n);}
  if(fx.q){const e=queueBuild(fx.q);if(e)logIt('立项失败：'+e,'bad');}if(fx.q2){queueBuild(fx.q2);}
  if(fx.file){S.file.push({y:S.year,t:fx.file.t,sev:fx.file.sev,exp:false,mild:false});}
  if(fx.mild){S.file.push({y:S.year,t:fx.mild.t,sev:0,exp:false,mild:true});}
  if(fx.sched)S.sched.push({id:fx.sched.id,m:fx.sched.m});
  if(fx.flag==='push')S.flags.push=1;if(fx.flag==='nosell')S.nosell=18;if(fx.flag==='taxcut')S.taxcut=36;
  if(fx.acc)S.accRisk+=fx.acc;if(fx.expose)S.expMult*=fx.expose;
  if(fx.housing)S.housing=clamp(S.housing+fx.housing,0,100);
  if(fx.addcq){const x=annualIncome()*fx.addcq;S.cq.push({amt:x,rate:10,left:24,term:24});}
  if(fx.swap){const sw=cqOut()*fx.swap;let x=sw;S.cq.sort((a,b)=>b.rate-a.rate);for(const b of S.cq){const y=Math.min(b.amt,x);b.amt-=y;x-=y;}S.cq=S.cq.filter(b=>b.amt>1);if(sw>1){S.sb.push({amt:sw,rate:2.8,left:120,term:120});logIt('置换债到位：'+fmt(sw)+'城投债转为法定债务。','good');}}
  if(fx.flag==='newcity')S.flags.newcity=1;if(fx.flag==='ppp')S.ppp=(S.ppp||0)+LV[S.lvl].transfer*0.04;
}

/* ---- 月结 ---- */
function tick(){
  const M={};const inc=monthIncome();M.tax=taxCommerce()+taxIndustry();M.transfer=transferPay();S.cash+=inc;
  const res=inc*S.reserveRate/100;S.cash-=res;S.reserve+=res;M.reserve=res;
  /* 三保 */
  const pay=(x)=>{const p=Math.min(x,Math.max(0,S.cash));S.cash-=p;return x-p;};
  M.wage=wageBill();M.ops=opsBill();M.live=liveBill();
  const gw=pay(M.wage),go=pay(M.ops),gl=pay(M.live);
  S.gaps.wage=gw>1?S.gaps.wage+1:0;S.gaps.ops=go>1?S.gaps.ops+1:0;S.gaps.live=gl>1?S.gaps.live+1:0;
  if(gw>1){S.sat-=2.5;S.rep-=1.5;S.unity-=2;S.sanbaoYr++;logIt('工资缓发'+fmt(gw)+'。','bad');if(S.gaps.wage===3)S.sched.push({id:'sanbao_risk',m:0});}
  if(go>1){S.sanbaoYr++;logIt('运转经费缺口'+fmt(go)+'。','bad');}
  if(gl>1){S.sat-=2;S.sanbaoYr++;logIt('基本民生支出缺口'+fmt(gl)+'。','bad');}
  /* 贫困拨款 */
  if(S.cash<0&&S.lvl<=1&&S.grantYr!==S.year){S.grantYr=S.year;const g=transferPay()*1.5;S.cash+=g;S.rep-=2;logIt('财政见底，申请到困难地区专项拨款'+fmt(g)+'。','sys');}
  /* 债务 */
  let interest=0,principal=0;
  for(const b of S.cq){interest+=b.amt*b.rate/1200;}for(const b of S.sb){interest+=b.amt*b.rate/1200;}interest+=S.platform*6/1200;
  const gi=pay(interest);if(gi>1){S.interestMiss++;S.rep-=2;S.unity-=1;if(S.cq.length){S.cq.sort((a,b)=>b.amt-a.amt);S.cq[0].amt+=gi;}else{S.cq.push({amt:gi,rate:8,left:12,term:12});}logIt('利息'+fmt(gi)+'未能支付，滚入本金。连续逾期'+S.interestMiss+'月。','bad');}else S.interestMiss=0;
  for(const b of [...S.cq,...S.sb]){b.left--;if(b.left<=0){const g=pay(b.amt);if(g>1){S.cash+=b.amt-g;b.left=24;b.rate+=1;S.rep-=4;S.unity-=2;logIt('到期本金'+fmt(b.amt)+'无力偿还，被迫展期。','bad');}else{principal+=b.amt;b.amt=0;}}}
  S.cq=S.cq.filter(b=>b.amt>1);S.sb=S.sb.filter(b=>b.amt>1);
  if(S.collect>0){S.collect--;const c=taxIndustry()*0.4;const p=Math.min(c,cqOut(),Math.max(0,S.cash));S.cash-=p;S.cq.sort((a,b)=>a.left-b.left);let left=p;for(const b of S.cq){const x=Math.min(b.amt,left);b.amt-=x;left-=x;if(left<=0)break;}S.cq=S.cq.filter(b=>b.amt>1);principal+=p;S.pros-=0.15;}
  M.interest=interest;M.principal=principal;
  /* 建设 */
  M.build=0;for(let i=S.build.length-1;i>=0;i--){const b=S.build[i];const inst=(b.cost-b.paid)/b.left;
    if(S.cash>=inst){S.cash-=inst;b.paid+=inst;b.left--;M.build+=inst;if(b.wl&&S.sbUnspent>0)S.sbUnspent=Math.max(0,S.sbUnspent-inst);
      if(b.left<=0){if(FAC[b.id].ind){S.ind.push({id:b.id,age:0});}S.f[b.id]++;S.built++;logIt(FAC[b.id].n+'建成投用。','good');S.build.splice(i,1);}}
    else{b.stalled=true;}}
  if(S.sbUnspent>1){if(wlCostLeft()<=0)S.sbIdle++;else S.sbIdle=0;
    if(S.sbIdle===6){S.rep-=3;logIt('专项债资金闲置半年，被审计点名。','bad');}
    if(S.sbIdle>=12){const x=S.sbUnspent;S.cash-=x;S.sb.sort((a,b)=>b.amt-a.amt);let left=x;for(const b of S.sb){const y=Math.min(b.amt,left);b.amt-=y;left-=y;if(left<=0)break;}S.sb=S.sb.filter(b=>b.amt>1);S.sbUnspent=0;S.sbIdle=0;S.rep-=3;logIt('专项债资金长期闲置，额度被扣回'+fmt(x)+'。','bad');}}
  else S.sbIdle=0;
  /* 指标 */
  for(const x of S.ind)x.age++;
  const J=jobs(),E=eff();
  const m1=v=>Math.min(1,v);
  /* 按设施权重通用计算：lw 宜居 pw 繁荣 ew 环境 hw 房价 sw 满意度 */
  let pw=0,lw=0,ew=0,hw=0,sw=0;
  for(const k of FACORDER){const F=FAC[k];if(F.ind)continue;const c=m1(cov(k));if(F.pw)pw+=F.pw*c;if(F.lw)lw+=F.lw*c;if(F.ew)ew+=F.ew*c;if(F.hw)hw+=F.hw*c;if(F.sw)sw+=F.sw*c;}
  const prosT=26+40*m1(J)+pw+6*(E-0.6)+(S.flags.push?3:0);
  const livT=18+lw+(S.env-50)/5-S.housing/8;
  S.pros+= (prosT-S.pros)*0.07;S.liv+=(livT-S.liv)*0.08;
  const satT=0.55*S.liv+0.25*(100-S.housing)+0.2*m1(J)*100+sw;S.sat+=(satT-S.sat)*0.06;
  let dens=(S.f.factory*1.6+S.ind.reduce((a,x)=>a+FAC[x.id].pol,0))/S.sc;
  S.env+=(66-S.env)*0.03-0.7*dens/(S.pop/LV[S.lvl].pop)+ew;
  if(hw)S.housing=clamp(S.housing-hw,0,100);
  S.pros=clamp(S.pros,0,100);S.liv=clamp(S.liv,0,100);S.sat=clamp(S.sat,0,100);S.env=clamp(S.env,0,100);
  S.pop*=1+0.0015*(S.liv-50)/10+0.002*(Math.min(J,1.2)-0.6)-(S.housing>70?0.001:0);
  S.housing=clamp(S.housing-0.5,0,100);S.rep+=(50-S.rep)*0.01;S.unity+=(60-S.unity)*0.02;
  if(S.taxcut>0)S.taxcut--;if(S.nosell>0)S.nosell--;
  /* 事故 */
  if(S.accRisk>0&&Math.random()<0.03*S.accRisk){S.accRisk=0;S.sched.push({id:'accident',m:0});}
  S.monthly=M;getters();
  /* 事件 */
  const due=S.sched.filter(x=>x.m<=0);S.sched=S.sched.filter(x=>x.m>0);for(const x of S.sched)x.m--;
  let evQueue=due.map(x=>x.id);
  /* 冷却：同一事件一年内几乎不重复，两年内低概率，四年后恢复 */
  const now=S.year*12+S.month;S.seen=S.seen||{};
  const cool=id=>{const t=S.seen[id];if(t===undefined)return 1;const a=now-t;return a<12?0.03:a<24?0.2:a<48?0.6:1;};
  const draw=(list,base)=>{const pool=list.map(e=>[e,base(e)*cool(e.id)]).filter(x=>x[1]>0);if(!pool.length)return null;const tot=pool.reduce((a,x)=>a+x[1],0);let r=Math.random()*tot;for(const [e,w] of pool){r-=w;if(r<=0)return e.id;}return pool[pool.length-1][0].id;};
  if(!evQueue.length){
    const pPet=S.month%3===0?0.5:(S.sat<40?0.15:0.08);
    if(Math.random()<pPet){const id=draw(PET.filter(p=>!p.id.endsWith('2')&&(!p.cond||p.cond(S))),()=>1);if(id)evQueue.push(id);}
    else if(Math.random()<0.6){const id=draw(EV.filter(e=>e.w>0&&S.lvl>=e.lv[0]&&S.lvl<=e.lv[1]&&!(e.once&&S.once[e.id])&&(!e.cond||e.cond(S))),e=>e.w);if(id)evQueue.push(id);}}
  for(const id of evQueue)S.seen[id]=now;
  S.month++;let annualDue=false;if(S.month>12){S.month=1;annualDue=true;}
  return {evQueue,annualDue};
}

function annual(){
  S.year++;S.age++;S.tenure++;S.recruitThisYear=0;S.sbYear=0;S.staff=Math.round(S.staff*0.985);S.quota=Math.round(staffNeed()*1.06);
  const R={};R.year=S.year-1;
  const sanctionsYr=S.file.filter(f=>f.mild&&f.exp&&f.expY===R.year).length;
  R.debtPen=Math.max(0,hdr()-60)/4;R.accPen=S.accidentsYr*10;R.cleanPen=sanctionsYr*8;
  R.raw=0.5*S.pros+0.3*S.liv+0.2*S.sat-R.debtPen-R.accPen-R.cleanPen;
  let g=R.raw>=76?'A':R.raw>=60?'B':R.raw>=45?'C':'D';
  R.sanbao=S.sanbaoYr>0;if(R.sanbao)g=g==='A'?'B':g==='B'?'C':'D';
  R.grade=g;R.tension=tension();const gain={A:30,B:18,C:8,D:-12}[g];S.merit+=gain;R.gain=gain;
  S.dRun=g==='D'?S.dRun+1:0;S.ratings.push(g);R.rep=S.rep;
  if(g==='A'){S.rep+=3;if(Math.random()<0.5)S.sched.push({id:'commend',m:1});}
  /* 倒查 */
  R.exposed=null;
  for(const f of S.file){if(f.exp)continue;
    if(f.mild){if(S.year-f.y<=2&&Math.random()<0.15){f.exp=true;f.expY=S.year;S.sanctions++;S.rep-=4;S.merit-=6;logIt('通报处分：'+f.t+'。','bad');}}
    else{const p=(0.05*f.sev+0.03*(S.year-f.y))*S.expMult;if(Math.random()<p){f.exp=true;f.expY=S.year;R.exposed=f;}}}
  S.expMult=Math.max(1,S.expMult*0.8);
  /* 化债任务书 */
  if(S.task){if(hdr()<=S.task.target){logIt('化债任务书按期完成。','good');S.task=null;S.frozen=false;}
    else if(S.year>=S.task.deadline){S.frozen=true;S.rep-=5;logIt('化债任务书到期未完成，新增融资冻结。','bad');S.task={deadline:S.year+1,target:hdr()*0.8};}}
  else if(hdr()>=70){S.task={deadline:S.year+1,target:hdr()*0.8};S.sched.push({id:'task_notice',m:0});}
  if(S.frozen&&hdr()<60&&!S.task){S.frozen=false;logIt('隐性债务率回落，融资冻结解除。','good');}
  S.sanbaoYr=0;S.accidentsYr=0;S.flags.push=0;
  S.resume.push({y:R.year,t:LV[S.lvl].city+'第'+S.tenure+'年，年度考核'+g+'，政绩'+Math.round(S.merit)});
  /* 仕途判定 */
  R.next=null;
  if(R.exposed)R.next='fall';
  else if(S.sanctions>=4||S.dRun>=2)R.next='fired';
  else if(S.age>=60)R.next='retire';
  else if(S.lvl<4&&S.merit>=LV[S.lvl].need&&R.tension<=60&&!S.task&&S.unity>=35&&(g==='A'||g==='B')){
    const risk=S.file.filter(f=>!f.exp&&!f.mild);let caught=null;for(const f of risk){if(Math.random()<(0.05*f.sev+0.03*(S.year-f.y))*2){f.exp=true;f.expY=S.year;caught=f;break;}}
    R.next=caught?'fall':'promote';if(caught)R.exposed=caught;}
  else if(S.tenure>=LV[S.lvl].maxY&&S.lvl<4)R.next='sidelined';
  return R;
}

  on('#btnSell',()=>sellLand(+$('#landN').value));on('#btnCQ',()=>issueCQ(+$('#cqN').value,+$('#cqT').value));on('#btnSB',()=>issueSB(+$('#sbN').value,+$('#sbT').value));
  on('#btnRep',()=>repayCQ(+$('#repN').value));on('#btnRev',revitalize);on('#btnCol',collectStart);on('#btnExt',extendCQ);on('#btnPlat',platformTransform);
  on('#btnRec',()=>recruit(+$('#recN').value));on('#btnCut',()=>cutStaff(+$('#cutN').value));on('#btnReform',reform);
  const rr=$('#resRate');if(rr)rr.oninput=()=>{S.reserveRate=+rr.value;$('#resRateV').textContent=rr.value+'%';};
}
function toast(msg){logIt(msg,'bad');}
/* ---- 弹窗 ---- */
function showDoc(html,cls){$('#doc').className='doc '+(cls||'');$('#doc').innerHTML=html;$('#modal').classList.add('on');}
function hideDoc(){$('#modal').classList.remove('on');}
function showEvent(ev,done){const kind=ev.id.startsWith('p_')?'信访件':SYSEV[ev.id]?'通知':/^r\d$/.test(ev.id)?'退休第'+S.retY+'年':'呈批件';
  const A=evArt(ev);
  showDoc(`${A.wide?artBox(A.wide,'wide'):artBox(A.scene)}<div class="dh"><div class="kind">${kind}</div><h2>${esc(ev.title)}</h2></div><div class="body${A.portrait?' hasp':''}">${artPortrait(A.portrait)}<div>${esc(ev.text)}</div></div><div class="opts">${ev.opts.map((o,i)=>`<button class="opt${o.grey?' grey':''}" data-i="${i}"><span class="ot">${esc(o.t)}</span>${o.n?'<span class="on">'+esc(o.n)+'</span>':''}</button>`).join('')}</div>`);
  document.querySelectorAll('#doc .opt').forEach(b=>b.onclick=()=>{const o=ev.opts[+b.dataset.i];applyFx(o.fx);if(ev.once)S.once[ev.id]=1;logIt('【'+ev.title+'】'+o.t+(o.grey?'（进入责任档案）':''),o.grey?'bad':'');hideDoc();if(o.end){busy=false;endGame(o.end);renderAll();showEnding();return;}done();});}
function showReview(R,done){const L=LV[S.lvl];
  showDoc(`<div class="dh"><div class="kind">年度考核通报</div><h2>关于第 ${R.year} 年度${esc(L.city)}综合考核结果的通报</h2></div><div class="body"><div class="row" style="align-items:flex-end"><span class="grade">${R.grade}</span><span class="muted" style="padding-bottom:6px">${{A:'优秀',B:'良好',C:'合格',D:'不合格'}[R.grade]}${R.sanbao?'（三保出现缺口，压档一档）':''}</span></div>
  <table style="margin:10px 0"><tr><td>综合得分</td><td class="r">${R.raw.toFixed(1)}</td></tr><tr><td>繁荣 ×0.5 / 宜居 ×0.3 / 满意 ×0.2</td><td class="r">${(0.5*S.pros).toFixed(0)} / ${(0.3*S.liv).toFixed(0)} / ${(0.2*S.sat).toFixed(0)}</td></tr><tr><td>债务扣分</td><td class="r">−${R.debtPen.toFixed(1)}</td></tr><tr><td>事故扣分</td><td class="r">−${R.accPen}</td></tr><tr><td>廉政扣分</td><td class="r">−${R.cleanPen}</td></tr><tr><td>政绩变动</td><td class="r">${R.gain>0?'+':''}${R.gain}　累计 ${Math.round(S.merit)}</td></tr><tr><td>财政紧张度</td><td class="r">${R.tension.toFixed(0)}</td></tr></table>
  ${R.next==='promote'?'<p><b>组织部门已启动考察程序。</b></p>':R.next==='fall'?'<p style="color:var(--red)"><b>纪委监委在考察中发现线索。</b></p>':R.next==='sidelined'?'<p>本任年限已满。</p>':''}<span class="seal">考核办</span></div><div class="opts"><button class="opt" id="rvOk"><span class="ot">知道了</span></button></div>`,'notice');
  $('#rvOk').onclick=()=>{hideDoc();done();};}
function showPromo(lvl,done){showDoc(`<div class="dh"><div class="kind">任职通知</div><h2>关于${esc(LV[lvl].city.replace(/（.*/,''))}主要领导任职的通知</h2></div><div class="body">${esc(PROMO_TEXT[lvl])}\n\n上一任的政绩按四分之一带入新任期。新城市有存量债务，先看账。<span class="seal">组织部</span></div><div class="opts"><button class="opt" id="prOk"><span class="ot">到任</span></button></div>`,'notice');
  $('#prOk').onclick=()=>{hideDoc();done();};}
function showEnding(){busy=false;const E=ENDINGS[S.over];
  showDoc(`${artBox('e_'+S.over,'wide')}<div class="dh"><div class="kind">结局</div><h2>${esc(E.t)}</h2></div><div class="body">${esc(E.d)}\n\n仕途 ${S.year-1} 年，终于 ${LV[S.lvl].t}（${esc(LV[S.lvl].city)}），${S.age} 岁。${S.hist.length?'\n\n'+S.hist.map(h=>h.city.replace(/（.*/,'')+' '+h.years+'年，建成'+h.built+'项，离任隐债率'+h.hdr+'%').join('；')+'。':''}历年考核：${S.ratings.join(' ')||'—'}。责任档案 ${S.file.length} 条。</div><div class="opts"><button class="opt" id="edFile"><span class="ot">查看履历与档案</span></button><button class="opt" id="edNew"><span class="ot">重新开局</span></button></div>`,'notice');
  $('#edFile').onclick=()=>{hideDoc();S.tab='file';renderAll();};$('#edNew').onclick=()=>{hideDoc();LS.del('yifang_save');newGame();renderAll();};
  LS.del('yifang_save');}
/* ---- 推进 ---- */
let busy=false;
function next(){if(busy||!S||S.over)return;busy=true;
  if(S.phase==='retired'){const ev=retiredStep();if(!ev){busy=false;return;}showEvent(ev,()=>{busy=false;save();renderAll();});return;}
  const before={y:S.year,m:S.month,cash:S.cash,pros:S.pros,liv:S.liv,sat:S.sat,env:S.env,hdr:hdr(),pop:S.pop,rep:S.rep,unity:S.unity,seq:S.logSeq||0,building:S.build.length};
  const {evQueue,annualDue}=tick();renderAll();
  const inst=checkInstant();if(inst){endGame(inst);renderAll();showEnding();busy=false;return;}
  const runEvents=(i,after)=>{if(i>=evQueue.length){after();return;}const ev=findEvent(evQueue[i]);if(!ev){runEvents(i+1,after);return;}showEvent(ev,()=>{renderAll();if(S.over)return;runEvents(i+1,after);});};
  showMonthly(before,()=>runEvents(0,()=>{if(!annualDue){busy=false;save();renderAll();return;}
    const R=annual();renderAll();showReview(R,()=>{
      if(R.next==='fall'){closeLevel();endGame('fall');renderAll();showEnding();busy=false;return;}
      if(R.next==='fired'){closeLevel();endGame('fired');renderAll();showEnding();busy=false;return;}
      if(R.next==='sidelined'){closeLevel();endGame('sidelined');renderAll();showEnding();busy=false;return;}
      if(R.next==='retire'){closeLevel();S.phase='retired';S.retY=0;logIt('到龄退休。','sys');showDoc(`<div class="dh"><div class="kind">通知</div><h2>关于退休的通知</h2></div><div class="body">六十岁。组织谈话很短，感谢了你的工作。办公室的人帮你收拾东西，一个纸箱就装完了。\n\n往后几年，每次推进是一年。</div><div class="opts"><button class="opt" id="rtOk"><span class="ot">离开办公室</span></button></div>`,'notice');$('#rtOk').onclick=()=>{hideDoc();busy=false;save();renderAll();};return;}
      if(R.next==='promote'){const nl=S.lvl+1;showPromo(nl,()=>{initLevel(nl,S.merit*0.25);S.resume.push({y:S.year,t:'任'+LV[nl].city.replace(/（.*/,'')+LV[nl].t});logIt('到任'+LV[nl].city+'。','sys');busy=false;save();renderAll();preloadArt();});return;}
      busy=false;save();renderAll();});}));
}
/* ---- 月度简报 ---- */
function showMonthly(B,done){const M=S.monthly;if(!M){done();return;}
  const news=S.log.filter(x=>x.q>B.seq).reverse();
  const bad=news.some(x=>x.c==='bad')||S.cash<0;
  const dv=(l,a,b,unit,pp)=>{const d=b-a;if(Math.abs(d)<0.05)return '';return `<span class="chip ${d>0?'up':'down'}">${l} ${d>0?'+':'−'}${Math.abs(d).toFixed(1)}${unit||''}</span>`;};
  const chips=[dv('繁荣',B.pros,S.pros),dv('宜居',B.liv,S.liv),dv('满意',B.sat,S.sat),dv('环境',B.env,S.env),dv('隐债率',B.hdr,hdr(),'pp'),dv('声誉',B.rep,S.rep),dv('团结',B.unity,S.unity),dv('人口',B.pop,S.pop,'万')].filter(Boolean).join('');
  const net=S.cash-B.cash;
  if(S.brief&&!bad){mtoast(`${B.y}年${B.m}月　结余 ${net>=0?'+':'−'}${fmt(Math.abs(net))}　${chips?chips.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim():'指标平稳'}`);done();return;}
  const inc=M.tax+M.transfer,exp3=M.wage+M.ops+M.live,debt=M.interest+M.principal;
  showDoc(`<div class="dh"><div class="kind">月度简报</div><h2>第 ${B.y} 年 ${B.m} 月 财政运行与工作简报</h2></div><div class="body brief">
  <div class="kv"><div><i>收入</i><b class="pos">+${fmt(inc)}</b></div><div><i>三保</i><b class="neg">−${fmt(exp3)}</b></div><div><i>还本付息</i><b class="neg">−${fmt(debt)}</b></div><div><i>建设</i><b class="neg">−${fmt(M.build)}</b></div><div><i>结余变动</i><b class="${net>=0?'pos':'neg'}">${net>=0?'+':'−'}${fmt(Math.abs(net))}</b></div><div><i>财政结余</i><b class="${S.cash<0?'neg':''}">${fmt(S.cash)}</b></div></div>
  <div class="chips">${chips||'<span class="muted">各项指标平稳。</span>'}</div>
  <div class="news"><div class="nt">本月要闻</div>${news.length?news.map(x=>`<div class="${x.c}">${esc(x.t)}</div>`).join(''):'<div class="muted">无事。'+(S.build.length?S.build.length+' 个项目在建。':'')+'</div>'}</div>
  </div><div class="opts"><button class="opt" id="mbOk"><span class="ot">继续</span></button><label class="brief-opt"><input type="checkbox" id="mbBrief" ${S.brief?'checked':''}> 平常月份不弹简报，改为顶部一行提示（有异常仍会弹出）</label></div>`,'notice');
  $('#mbBrief').onchange=e=>{S.brief=e.target.checked?1:0;};
  $('#mbOk').onclick=()=>{hideDoc();done();};}
let _mt=null;
function mtoast(t){let el=$('#mtoast');if(!el){el=document.createElement('div');el.id='mtoast';document.body.appendChild(el);}el.textContent=t;el.classList.add('on');clearTimeout(_mt);_mt=setTimeout(()=>el.classList.remove('on'),2600);}
const LS={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
function save(){LS.set('yifang_save',JSON.stringify(S));}
function migrate(){if(!S)return;S.f=S.f||{};for(const k of FACORDER)if(S.f[k]===undefined)S.f[k]=0;if(S.f.factory===undefined)S.f.factory=0;S.seen=S.seen||{};S.brief=S.brief||0;S.buildCat=S.buildCat||'traffic';S.logSeq=S.logSeq||S.log.length;S.build=(S.build||[]).filter(b=>FAC[b.id]);S.ind=(S.ind||[]).filter(x=>FAC[x.id]);}
function load(){try{const s=LS.get('yifang_save');if(!s)return false;S=JSON.parse(s);migrate();return true;}catch(e){return false;}}
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;renderAll();});
  $('#nextbtn').onclick=next;
  $('#btnNew').onclick=()=>{newGame();$('#cover').style.display='none';renderAll();preloadArt();};
  $('#btnLoad').onclick=()=>{if(load()){$('#cover').style.display='none';renderAll();preloadArt();}else alert('没有找到存档。');};
  $('#btnSave').onclick=()=>{save();logIt('已保存。','sys');renderAll();};
  $('#btnExport').onclick=()=>{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S));a.download='一方水土-存档-第'+S.year+'年.json';a.click();};
  $('#btnImport').onclick=()=>$('#fileIn').click();
  $('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);migrate();renderAll();logIt('存档已导入。','sys');renderAll();}catch(x){alert('存档文件无法读取。');}};r.readAsText(f);};
  $('#btnReset').onclick=()=>{if(confirm('放弃当前进度，重新开局？')){LS.del('yifang_save');newGame();renderAll();}};
  $('#modal').onclick=e=>{if(e.target.id==='modal'){/* 呈批件必须处理，不允许点空白关闭 */}};
  if(LS.get('yifang_save'))$('#btnLoad').textContent='继续上次';
});
/* ---- 底部「下月」条：按实际高度留出正文空间，避免遮挡末尾卡片 ---- */
(function(){
  var bar=document.querySelector('#side .card.next');
  if(!bar)return;
  var fit=function(){
    var fixed=getComputedStyle(bar).position==='fixed';
    document.body.style.paddingBottom=fixed?(bar.offsetHeight+14)+'px':'';
  };
  fit();
  addEventListener('resize',fit);addEventListener('orientationchange',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(bar);
  document.addEventListener('DOMContentLoaded',fit);
  setTimeout(fit,300);
})();

/* ---- 防误触缩放：iOS Safari 忽略 user-scalable=no，需手动拦截手势 ---- */
(function(){
  var stop=function(e){e.preventDefault();};
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    document.addEventListener(t,stop,{passive:false});
  });
  document.addEventListener('touchmove',function(e){
    if(e.touches&&e.touches.length>1)e.preventDefault();
  },{passive:false});
  document.addEventListener('dblclick',stop,{passive:false});
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},{passive:false});
})();
</script>
</body>
</html>

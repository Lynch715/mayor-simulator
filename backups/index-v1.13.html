<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F2EE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一方水土">
<meta name="application-name" content="一方水土">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icon/icon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="assets/icon/icon-120.png">
<title>一方水土</title>
<style>
.phase-scroll{overflow-x:auto;max-width:100%}.phase-scroll table{min-width:360px}.phase-note{font-size:12px;color:var(--ink2);line-height:1.7}.phase-actions{display:flex;gap:8px;flex-wrap:wrap}.phase-actions button{min-height:40px}.phase-select{max-width:100%;min-height:44px}.phase-forecast td{white-space:normal}.phase-panel{overflow-wrap:anywhere}.phase-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.phase-row input{width:100px;max-width:100%;min-height:44px}

:root{
  --paper:#F3F2EE;--paper2:#EAE8E1;--ink:#22252A;--ink2:#5A5E66;--ink3:#8B8F98;
  --red:#B4231C;--red2:#8E1A15;--blue:#234C86;--blue2:#1B3C6B;
  --green:#2E6B4A;--gold:#9A7A2A;--line:#C9C6BC;--line2:#DDDBD3;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body{min-height:100%;touch-action:manipulation;overscroll-behavior-y:none;-webkit-tap-highlight-color:rgba(35,76,134,.12)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:2px}
button:hover{border-color:var(--ink2)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary:hover{background:var(--blue2)}
button.danger{color:var(--red);border-color:var(--red)}
button.sm{padding:3px 10px;font-size:13px}
input[type=range]{width:100%;accent-color:var(--blue)}
select,input[type=number]{font-family:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--ink3)}
h1,h2,h3{font-family:var(--serif);font-weight:700}

/* 红头 */
#head{background:#fff;border-bottom:1px solid var(--line)}
#head .inner{max-width:1120px;margin:0 auto;padding:14px 20px 0}
#head .redtitle{font-family:var(--serif);color:var(--red);font-size:28px;letter-spacing:.12em;font-weight:700;text-align:center;line-height:1.25}
#head .redtitle small{display:block;font-size:13px;letter-spacing:.3em;color:var(--red);font-weight:400;margin-top:2px}
#head .rule{height:0;border-top:2px solid var(--red);border-bottom:1px solid var(--red);margin:10px 0 0}
#head .meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;padding:8px 0 10px;font-size:14px;color:var(--ink2)}
#head .meta b{color:var(--ink);font-weight:600}

/* 指标条 */
#stats{max-width:1120px;margin:14px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line2);padding:9px 12px;position:relative}
.stat .l{font-size:12px;color:var(--ink3)}
.stat .v{font-size:20px;font-weight:600;line-height:1.2;margin-top:2px}
.stat .d{font-size:12px;margin-top:1px}
.stat .bar{height:3px;background:var(--paper2);margin-top:6px}
.stat .bar i{display:block;height:100%;background:var(--blue)}
.stat.warn .bar i{background:var(--red)}
.stat.warn .v{color:var(--red)}

/* 主体 */
#main{max-width:1120px;margin:14px auto;padding:0 20px;display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
#tabs{display:flex;border-bottom:1px solid var(--line);background:#fff}
#tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:10px 18px;border-radius:0;color:var(--ink2)}
#tabs button.on{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
#panel{background:#fff;border:1px solid var(--line2);border-top:0;padding:18px 20px;min-height:420px}
#side{position:sticky;top:12px}
.card{background:#fff;border:1px solid var(--line2);padding:14px 16px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
#nextbtn{width:100%;padding:12px;font-size:17px;font-family:var(--serif);letter-spacing:.2em}
#nexthint{margin:8px 0 0}
#log{max-height:300px;overflow:auto;font-size:13px;line-height:1.55}
#log div{padding:4px 0;border-bottom:1px dashed var(--line2)}
#log .t{color:var(--ink3);margin-right:6px;font-variant-numeric:tabular-nums}
#log .bad{color:var(--red)}#log .good{color:var(--green)}#log .sys{color:var(--blue)}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:13px;background:var(--paper)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
.sec{margin-bottom:22px}
.sec h2{font-size:17px;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--red)}
.hint{font-size:13px;color:var(--ink2);margin:6px 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.grid2>.sec{margin-bottom:0}
.sec>.grid2:last-child{margin-bottom:0}
.fac{border:1px solid var(--line2);padding:10px 12px;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:8px}
.fac svg{width:34px;height:34px}
.fac>div{min-width:0;overflow-wrap:anywhere}.fac .kvline span{white-space:normal;flex-wrap:wrap;max-width:100%}
.fac .n{font-weight:600;margin-bottom:3px}
.fac .i{font-size:12px;color:var(--ink2)}
.fac .cov{font-size:12px;margin-top:4px}
.fac .i.eff{color:var(--ink3)}
.fac .kvline{margin:4px 0 2px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:2px;color:var(--ink2);margin-left:6px;vertical-align:1px}
/* ===== 本月安排 ===== */
.rk{display:inline-block;font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:2px;padding:0 5px;margin-left:6px;vertical-align:1px}
.motag{display:inline-block;font-size:11px;font-weight:400;color:var(--ink2);border:1px solid var(--line);border-radius:2px;padding:1px 7px;margin-left:8px;vertical-align:2px;font-family:var(--sans)}
.agenda{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ag{text-align:left;background:#fff;border:1px solid var(--line);border-radius:3px;padding:9px 11px;display:block;width:100%;line-height:1.5}
.ag:hover{border-color:var(--ink2)}
.ag.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:rgba(180,35,28,.045)}
.ag .an{display:block;font-weight:700;font-size:14px;color:var(--ink);margin-bottom:2px}
.ag .an i{font-style:normal;font-weight:400;font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-radius:2px;padding:0 4px;margin-left:6px;vertical-align:1px}
.ag .ad{display:block;font-size:12px;color:var(--ink3)}
.ag.on .ad{color:var(--ink2)}
.winds{margin-top:8px}
.wb{position:relative;height:22px;background:var(--paper2);border-radius:2px;margin-bottom:5px;overflow:hidden}
.wb i{position:absolute;left:0;top:0;bottom:0;background:rgba(35,76,134,.22);display:block}
.wb span{position:relative;display:block;padding:2px 8px;font-size:12px;color:var(--ink2);line-height:18px}
.wx{font-size:12px;color:var(--red2);margin-top:6px}
.dh .by{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--ink2);font-family:var(--sans)}
.dh .by b{font-weight:700;color:var(--ink)}
.dh .by em{font-style:normal;color:var(--ink3)}
.fbar{display:inline-block;width:64px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden;vertical-align:middle}
.fbar i{display:block;height:100%;background:var(--blue)}
.fbar.wide{display:block;width:100%;height:6px;margin:7px 0 3px}
.opt.dis{opacity:.5;cursor:not-allowed;background:var(--paper2)}
.opt.dis:hover{border-color:var(--line)}
.rels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.rel{border:1px solid var(--line);border-radius:3px;padding:9px 11px;background:#fff}
.rel .rn{font-size:14px}
.rel .rn b{font-weight:700}
.rel .rf{font-size:12px;color:var(--ink2)}
.rel .rd{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.55}
.rel .rd i{font-style:normal;color:var(--blue2)}
.plots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.plot{border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:#fff}
.plot .ph{font-size:14px;margin-bottom:4px}
.plot .ph b{font-weight:700}
.plot .pm{font-size:12px;color:var(--ink2);margin-bottom:8px}
.plot .pb{display:flex;flex-wrap:wrap;gap:6px}
.plot .pb button{font-size:12px;padding:5px 9px}
.leads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lead{border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:#fff}
.lead .lh{font-size:14px;margin-bottom:4px}
.lead .lh b{font-weight:700}
.lead .lm{font-size:12px;color:var(--ink2);margin-bottom:4px}
.lead .lm b{color:var(--ink)}
.lead .lw{font-size:12px;color:var(--red2);margin:4px 0}
.lead .pb{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.lead .pb button{font-size:12px;padding:5px 9px}
.row button.sm.on,.tal button.sm.on{border-color:var(--red);color:var(--red);background:rgba(180,35,28,.05);font-weight:700}
/* 键值型 meta 行：整齐换行，不靠全角空格硬拼 */
.kvline,.plot .pm,.lead .lm{display:flex;flex-wrap:wrap;gap:3px 16px;font-size:12px;color:var(--ink2);margin-bottom:7px;line-height:1.6}
.kvline span,.plot .pm span,.lead .lm span{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.kvline i,.plot .pm i,.lead .lm i{font-style:normal;color:var(--ink3)}
.kvline b,.lead .lm b{color:var(--ink);font-weight:700}
.lead .lm.ask{padding-top:6px;border-top:1px dashed var(--line2)}
.coopdesc{margin-top:8px;font-size:12px;color:var(--ink3);line-height:1.65}
.coopdesc div+div{margin-top:2px}
.coopdesc b{color:var(--ink2);font-weight:600;margin-right:6px}
.tal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tal button{width:100%}
button.sm.quiet{color:var(--ink3)}
button.sm.quiet:hover{color:var(--red);border-color:var(--red)}
/* 卡片标题里的标签换行时不要贴在一起 */
.plot .ph,.lead .lh,.rel .rn{line-height:1.9}
/* 空的权重条也要看得出是条 */
.wb i{min-width:2px;background:rgba(35,76,134,.26)}
.wx{margin-top:9px}


.tag.hot{color:var(--red);border-color:var(--red)}
.tag.cool{color:var(--blue2)}
.tag.cold{color:var(--ink3)}
table.dist td{vertical-align:top}
table.dist .rd{font-size:12px;color:var(--ink3);margin-top:3px;font-weight:400}
.tiers{display:flex;flex-wrap:nowrap;gap:3px}
.tiers.fo{flex-wrap:wrap}
.tiers button{font-size:12px;padding:3px 6px;min-width:0;white-space:nowrap}
.tiers button.on{border-color:var(--red);color:var(--red);background:rgba(180,35,28,.06);font-weight:700}





.tag.red{color:var(--red);border-color:var(--red)}
.tag.blue{color:var(--blue);border-color:var(--blue)}
.tag.green{color:var(--green);border-color:var(--green)}
.gauge{height:8px;background:var(--paper2);position:relative;margin:4px 0}
.gauge i{display:block;height:100%;background:var(--blue)}
.gauge i.warn{background:var(--red)}
.gauge .mk{position:absolute;top:-3px;width:1px;height:14px;background:var(--red)}

.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.subtabs button{padding:6px 12px;font-size:13px;border-radius:999px;background:var(--paper);color:var(--ink2)}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subtabs button .c{font-size:11px;margin-left:5px;opacity:.75;font-variant-numeric:tabular-nums}
.fac.locked{opacity:.55}

/* 债务页 */
.debt-top{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.debt-top b{font-size:28px;line-height:1}
.debt-top span{font-size:13px;line-height:1.45}
.act{display:flex;align-items:center;gap:8px}
.act input[type=number]{flex:1 1 80px;min-width:0;width:auto;max-width:160px}
.act select{flex:0 0 auto}
.paths .path{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.paths .path:last-child{border-bottom:0}
.path .pt{flex:1 1 auto;min-width:0}
.path .pt .muted{font-size:12px}
.path .pa{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.path .pa input[type=number]{width:110px}
@media (max-width:640px){
  .act{flex-wrap:wrap}
  .act select{flex:0 1 auto;min-width:0}
  .act button{flex:0 0 auto}
  #main>div,#panel,#tabs{min-width:0}
  .act input[type=number]{max-width:none}
  .act select{padding:10px 8px}
  .paths .path{flex-direction:column;align-items:stretch;gap:8px}
  .path .pa{justify-content:flex-end}
  .path .pa input[type=number]{flex:1 1 auto;width:auto;min-width:0}
  .path .pa button{flex:0 0 auto;min-width:92px}
  .debt-top b{font-size:26px}
}

/* 月度简报 */
.doc .body.brief{white-space:normal}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kv div{background:var(--paper);border:1px solid var(--line2);padding:7px 10px}
.kv i{display:block;font-style:normal;font-size:12px;color:var(--ink3)}
.kv b{font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:13px}
.chip{border:1px solid var(--line);padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.chip.up{color:var(--green);border-color:var(--green)}.chip.down{color:var(--red);border-color:var(--red)}
.news .nt{font-size:12px;color:var(--ink3);letter-spacing:.1em;margin-bottom:4px}
.news div+div{margin-top:3px}
.news .bad{color:var(--red)}.news .good{color:var(--green)}.news .sys{color:var(--blue)}
.brief-opt{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink3);line-height:1.5;cursor:pointer}
.brief-opt input{margin-top:3px;flex:0 0 auto}
#mtoast{position:fixed;left:50%;top:10px;transform:translate(-50%,-140%);max-width:min(92vw,640px);background:rgba(34,37,42,.94);color:#fff;font-size:13px;padding:9px 16px;border-radius:4px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .25s ease;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mtoast.on{transform:translate(-50%,0)}
@media (max-width:640px){.kv{grid-template-columns:repeat(2,1fr);gap:6px}.kv b{font-size:15px}#mtoast{top:calc(8px + env(safe-area-inset-top));font-size:12px;padding:8px 12px}}

/* 呈批件弹窗 */
#modal{position:fixed;inset:0;background:rgba(30,32,36,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
.doc{background:#fff;max-width:640px;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.doc .dh{padding:18px 26px 12px;border-bottom:1px solid var(--line2)}
.doc .kind{font-size:12px;color:var(--ink3);letter-spacing:.2em}
.doc h2{font-size:21px;margin-top:4px;line-height:1.35}
.doc .body{padding:18px 26px;font-size:15px;line-height:1.85;white-space:pre-line}
.doc .body p{margin-bottom:10px}
.doc .opts{padding:0 26px 22px;display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:11px 14px;border:1px solid var(--line);background:#fff;line-height:1.5;display:block;width:100%}
.opt:hover{border-color:var(--blue);background:#F7F9FC}
.opt .ot{font-weight:600}
.opt .on{font-size:13px;color:var(--ink2);display:block;margin-top:2px}
.opt.grey{border-left:3px solid var(--red)}
.doc.notice .body{font-family:var(--serif)}
.seal{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:var(--serif);font-size:13px;padding:2px 8px;transform:rotate(-8deg);opacity:.85;margin-top:8px;letter-spacing:.1em}
.grade{font-family:var(--serif);font-size:44px;color:var(--red);line-height:1}

/* 美术资产 */
.art{width:100%;aspect-ratio:3/1;overflow:hidden;background:var(--paper2);position:relative}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.wide{aspect-ratio:2/1}
.art.banner{border:1px solid var(--line2);margin-bottom:16px}
.doc .art{border-bottom:1px solid var(--line2)}
.doc .art:after{content:"";position:absolute;inset:0;box-shadow:inset 0 -24px 24px -24px rgba(34,37,42,.18);pointer-events:none}
.doc .body.hasp{display:grid;grid-template-columns:128px 1fr;gap:6px 18px;align-items:start}
.doc .portrait{aspect-ratio:3/4;overflow:hidden;position:sticky;top:0}
.doc .portrait img{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block}
.doc .portrait:after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:1px;background:var(--line)}

/* 开始/结局 */
#cover{position:fixed;inset:0;background:var(--paper) url(assets/cover.webp) center/cover no-repeat;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#cover:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(243,242,238,.15),rgba(243,242,238,.55));pointer-events:none}
#cover .box{position:relative;max-width:560px;width:100%;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:36px 40px;box-shadow:0 24px 60px rgba(34,37,42,.25)}
#cover h1{font-size:44px;letter-spacing:.3em;color:var(--red);text-align:center;line-height:1.2}
#cover .sub{text-align:center;color:var(--ink2);margin:6px 0 22px;letter-spacing:.15em;font-size:14px}
#cover p{margin-bottom:10px;font-size:14px;line-height:1.8}
#cover .rule{border-top:2px solid var(--red);border-bottom:1px solid var(--red);height:0;margin:0 0 18px}
#cover .foot{font-size:12px;color:var(--ink3);margin-top:18px;line-height:1.7}
.resume li{padding:5px 0;border-bottom:1px dashed var(--line2);font-size:14px}
.resume .y{color:var(--ink3);margin-right:8px;font-variant-numeric:tabular-nums}
.file li{padding:6px 0;border-bottom:1px dashed var(--line2);font-size:14px}
.file .sev{color:var(--red);font-size:12px;margin-left:6px}
.file .exp{color:var(--ink3);font-size:12px;margin-left:6px}

@media (max-width:900px){
  #main{grid-template-columns:1fr}
  #side{position:static}

function agWeight(k){const a=AG[k];let w=a.w?a.w(S):1;if(a.mo&&a.mo.indexOf(S.month)>=0)w*=4;return Math.max(0.02,w);}
function agRefresh(){
  if(!S||S.phase==='retired'){S.agPool=[];S.ag='routine';return;}
  const now=S.year*12+S.month;S.agCd=S.agCd||{};
  let avail=Object.keys(AG).filter(k=>{if(k==='routine')return false;const a=AG[k];
    if(S.agCd[k]&&S.agCd[k]>now)return false;
    if(a.only&&a.only.indexOf(S.month)<0)return false;
    if(a.cond&&!a.cond(S))return false;return true;});
  const pool=[];let rest=avail.slice();const used={};
  const take=arr=>{const tot=arr.reduce((s,k)=>s+agWeight(k),0);let r=Math.random()*tot,got=arr[arr.length-1];
    for(const k of arr){r-=agWeight(k);if(r<=0){got=k;break;}}return got;};
  while(pool.length<3&&rest.length){const g=take(rest);pool.push(g);used[AG[g].cat]=1;
    rest=rest.filter(k=>k!==g&&!used[AG[k].cat]);}
  if(pool.length<3){let more=avail.filter(k=>pool.indexOf(k)<0);
    while(pool.length<3&&more.length){const g=take(more);pool.push(g);more=more.filter(k=>k!==g);}}
  S.agPool=pool;S.ag='routine';
}
function runAgenda(){
  S.agFlag={};const k=S.ag||'routine';const a=AG[k];if(!a)return;
  if(k!=='routine'){const now=S.year*12+S.month;if(a.cd)S.agCd[k]=now+a.cd;S.agN=(S.agN||0)+1;
    S.agUse=S.agUse||{};S.agUse[k]=(S.agUse[k]||0)+1;}
  const t=a.f?a.f():'';
  if(t)logIt('【'+a.n+'】'+t,'sys');
  S.pros=clamp(S.pros,0,100);S.liv=clamp(S.liv,0,100);S.sat=clamp(S.sat,0,100);
  S.env=clamp(S.env,0,100);S.rep=clamp(S.rep,0,100);S.unity=clamp(S.unity,0,100);
}

 for(const d of ds){tp+=d.pros*d.pop;tl+=d.liv*d.pop;td+=d.debt*d.pop;w+=d.pop;}
 return {pros:tp/w,liv:tl/w,debt:td/w};}

 return null;}
function distStep(){if(!S.dist)return;const cost=distTierCost();
 for(const d of S.dist){const a=S.alloc[d.id]||{fund:0,focus:'eco'};
  const money=cost*a.fund;S.cash-=money;
  const g=a.fund*0.95*(d.lazy?0.42:1)*(1-d.pros/130);

function genPlots(n){const out=[];const inc=annualIncome();

  let fromRes=Math.min(S.reserve,amt);S.reserve-=fromRes;S.cash-=(amt-fromRes);let left=amt;

  S.cq=S.cq.filter(b=>b.amt>1);logIt('财政偿还城投债本金'+fmt(amt)+'。','good');return null;}
function revitalize(){if(S.flags['rev'+S.year])return '今年已盘活过';const mu=Math.min(S.land,80*S.lsc);if(mu<=0)return '没有可盘活资产';
  const v=landPrice()*mu*0.8;landTake(mu,'any','盘活');S.landSold+=mu;S.flags['rev'+S.year]=1;let left=v;S.cq.sort((a,b)=>a.left-b.left);
  for(const b of S.cq){const x=Math.min(b.amt,left);b.amt-=x;left-=x;if(left<=0)break;}S.cq=S.cq.filter(b=>b.amt>1);S.cash+=left;S.rep+=1;
  logIt('盘活存量资产偿债'+fmt(v-left)+'。','good');return null;}
function collectStart(){if(S.collect>0)return '正在执行';S.collect=12;logIt('启动归集企业税收偿债，为期一年。','sys');return null;}
function extendCQ(){if(!S.cq.length)return '没有城投债';for(const b of S.cq){b.left+=24;b.rate+=1;}S.rep-=4;S.unity-=1;logIt('城投债展期重组：期限延长两年，利率上调一个点。声誉受损。','bad');return null;}
function platformTransform(){if(S.lvl<1)return '县级以上才能操作';if(S.flags['plat'+S.lvl])return '本级已转型过';let x=cqOut()*0.2;
  for(const b of S.cq)b.amt*=0.8;S.platform+=x;S.flags['plat'+S.lvl]=1;logIt('城投平台转型：'+fmt(x)+'城投债转为经营性债务。','sys');return null;}
function recruit(n){n=Math.round(n);if(n<=0)return '';if(S.recruitThisYear>0)return '今年已招录';const room=S.quota-S.staff;if(n>room)return '超出核定编制';
  const cap=Math.round(S.staff*0.08);S.recruitThisYear=n;
  if(n>cap){const got=Math.round(cap+(n-cap)*0.5);S.staff+=got;S.sat-=3;S.rep-=2;logIt('招录'+n+'人，报录比超出承载，实际到岗'+got+'人，引发舆情。','bad');}
  else{S.staff+=n;logIt('招录事业编'+n+'人。');}return null;}
function cutStaff(n){n=Math.round(n);if(n<=0)return '';if(n>S.staff*0.1)return '一次最多缩编一成';S.staff-=n;S.unity-=3;S.sat-=1;logIt('缩减编制'+n+'人。班子有意见。','bad');return null;}
function reform(){if(S.reformDone)return '本级已完成机构改革';const c=LV[S.lvl].transfer*1.5;if(S.cash<c)return '需要'+fmt(c);S.cash-=c;S.reformDone=true;S.unity-=4;logIt('机构改革完成，行政运转成本下降。','sys');return null;}

/* ---- 效果应用 ---- */
function applyFx(fx){if(!fx)return;
  if(fx.fac&&fx.fac.id==='factory'&&fx.fac.n>0){const gate=industryGate('factory',S.planZone||'mixed');if(gate||landFree('ind')<20*S.lsc*fx.fac.n){logIt('项目效果未执行：'+(gate||'工业用地不足')+'。','bad');return;}}
  if(fx.cash)S.cash+=fx.cash*S.sc;if(fx.cashLand){const mu=Math.min(landFree('any'),fx.land<0?-fx.land*S.lsc:40*S.lsc);const rev=mu*landPrice()*fx.cashLand;landTake(mu,'any','事件出让');S.landSold+=mu;S.cash+=rev;S.landRev=(S.landRev||0)+rev;book('land',rev,'事件土地出让');}
  const _sf=(S.agFlag&&S.agFlag.soft)||1;if(fx.sat)S.sat=clamp(S.sat+(fx.sat<0?fx.sat*_sf:fx.sat),0,100);if(fx.env)envChange(fx.env,'event');if(fx.pros)S.pros=clamp(S.pros+fx.pros,0,100);
  if(fx.liv)S.liv=clamp(S.liv+fx.liv,0,100);if(fx.rep)S.rep=clamp(S.rep+fx.rep,0,100);if(fx.unity)S.unity=clamp(S.unity+fx.unity,0,100);
  if(fx.pop)S.pop*=1+fx.pop/100;if(fx.land&&!(fx.cashLand&&fx.land<0)){if(fx.land>0){landAdd(fx.land*S.lsc,'ind');S.landTotal+=fx.land*S.lsc;}else landTake(Math.min(landFree('any'),-fx.land*S.lsc),'any','事件占用');}
  if(fx.fac){if(fx.fac.n>0&&fx.fac.id==='factory'){addEventFactory(fx.fac.n);}else S.f[fx.fac.id]=Math.max(0,(S.f[fx.fac.id]||0)+fx.fac.n);}
  if(fx.q){const e=queueBuild(fx.q);if(e)logIt('立项失败：'+e,'bad');}if(fx.q2){queueBuild(fx.q2);}
  if(fx.file){S.file.push({y:S.year,t:fx.file.t,sev:fx.file.sev,exp:false,mild:false});}
  if(fx.mild){S.file.push({y:S.year,t:fx.mild.t,sev:0,exp:false,mild:true});}
  if(fx.sched)S.sched.push({id:fx.sched.id,m:fx.sched.m});
  if(fx.flag==='push')S.flags.push=1;if(fx.flag==='nosell')S.nosell=18;if(fx.flag==='taxcut')S.taxcut=36;
  if(fx.acc)S.accRisk+=fx.acc*_sf;if(fx.npc)nAdd(fx.npc.k,fx.npc.v);if(fx.npc2)nAdd(fx.npc2.k,fx.npc2.v);
  if(fx.fac2)S.f[fx.fac2.id]=Math.max(0,(S.f[fx.fac2.id]||0)+fx.fac2.n);if(fx.expose)S.expMult*=fx.expose;
  if(fx.housing)S.housing=clamp(S.housing+fx.housing,0,100);
  if(fx.addcq){const x=annualIncome()*fx.addcq;S.cq.push({amt:x,rate:10,left:24,term:24});}
  if(fx.swap){const sw=cqOut()*fx.swap;let x=sw;S.cq.sort((a,b)=>b.rate-a.rate);for(const b of S.cq){const y=Math.min(b.amt,x);b.amt-=y;x-=y;}S.cq=S.cq.filter(b=>b.amt>1);if(sw>1){S.sb.push({amt:sw,rate:2.8,left:120,term:120});logIt('置换债到位：'+fmt(sw)+'城投债转为法定债务。','good');}}
  if(fx.flag==='newcity')S.flags.newcity=1;if(fx.flag==='ppp')S.ppp=(S.ppp||0)+LV[S.lvl].transfer*0.04;
}

/* ---- 月结 ---- */
function tick(){
  phaseEnsure();const M={};const inc=monthIncome();M.tax=taxCommerce()+taxIndustry();M.transfer=transferPay();M.utility=utilityRevenue();M.rent=rentIncome();S.cash+=inc;book('tax',M.tax,'月度税收');book('transfer',M.transfer,'常规转移支付');book('utility',M.utility,'公共事业经营收入');book('rent',M.rent,'土地租金（按月收取）');
  const res=inc*S.reserveRate/100;S.cash-=res;S.reserve+=res;M.reserve=res;book('reserve',-res,'划入偿债准备金');
  /* 三保 */
  const pay=(x,kind)=>{const p=Math.min(x,Math.max(0,S.cash));S.cash-=p;if(kind)book(kind,-p,'月度支付');return x-p;};
  M.wage=wageBill();M.ops=opsBill()*((S.agFlag&&S.agFlag.ops)||1);M.live=liveBill();
  const gw=pay(M.wage,'wage'),go=pay(M.ops,'ops'),gl=pay(M.live,'live');M.wagePaid=M.wage-gw;M.opsPaid=M.ops-go;M.livePaid=M.live-gl;
  S.gaps.wage=gw>1?S.gaps.wage+1:0;S.gaps.ops=go>1?S.gaps.ops+1:0;S.gaps.live=gl>1?S.gaps.live+1:0;
  if(gw>1){S.sat-=2.5;S.rep-=1.5;S.unity-=2;S.sanbaoYr++;logIt('工资缓发'+fmt(gw)+'。','bad');if(S.gaps.wage===3)S.sched.push({id:'sanbao_risk',m:0});}
  if(go>1){S.sanbaoYr++;logIt('运转经费缺口'+fmt(go)+'。','bad');}
  if(gl>1){S.sat-=2;S.sanbaoYr++;logIt('基本民生支出缺口'+fmt(gl)+'。','bad');}
  /* 贫困拨款 */
  if(S.cash<0&&S.lvl<=1&&S.grantYr!==S.year){S.grantYr=S.year;const g=transferPay()*1.5;S.cash+=g;book('grant',g,'困难地区专项拨款');S.rep-=2;logIt('财政见底，申请到困难地区专项拨款'+fmt(g)+'。','sys');}
  /* 债务 */
  let interest=0,principal=0;
  for(const b of S.cq){interest+=b.amt*b.rate/1200;}for(const b of S.sb){interest+=b.amt*b.rate/1200;}interest+=S.platform*6/1200;
  const gi=pay(interest,'interest');M.interestPaid=interest-gi;if(gi>1){S.interestMiss++;S.rep-=2;S.unity-=1;if(S.cq.length){S.cq.sort((a,b)=>b.amt-a.amt);S.cq[0].amt+=gi;}else{S.cq.push({amt:gi,rate:8,left:12,term:12});}logIt('利息'+fmt(gi)+'未能支付，滚入本金。连续逾期'+S.interestMiss+'月。','bad');}else S.interestMiss=0;
  for(const b of [...S.cq,...S.sb]){b.left--;if(b.left<=0){const due=b.amt,g=pay(due,'principal');principal+=due-g;b.amt=g;if(g>1){b.left=24;b.rate+=1;S.rep-=4;S.unity-=2;logIt('到期本金'+fmt(due)+'，已还'+fmt(due-g)+'，剩余'+fmt(g)+'被迫展期。','bad');}else b.amt=0;}}
  S.cq=S.cq.filter(b=>b.amt>1);S.sb=S.sb.filter(b=>b.amt>1);
  if(S.collect>0){S.collect--;const c=taxIndustry()*0.4;const p=Math.min(c,cqOut(),Math.max(0,S.cash));S.cash-=p;book('principal',-p,'产业税收归集还本');S.cq.sort((a,b)=>a.left-b.left);let left=p;for(const b of S.cq){const x=Math.min(b.amt,left);b.amt-=x;left-=x;if(left<=0)break;}S.cq=S.cq.filter(b=>b.amt>1);principal+=p;S.pros-=0.15;}
  M.interest=interest;M.principal=principal;
  /* 建设 */
  M.build=0;for(let i=S.build.length-1;i>=0;i--){const b=S.build[i];if(b.crewPaused){b.stalled=true;continue;}const inst=(b.cost-b.paid)/b.left;
    if(S.cash>=inst){S.cash-=inst;b.paid+=inst;b.left--;M.build+=inst;book('build',-inst,'建设进度款');spendProjectBond(b,inst);
      if(b.left<=0){if(FAC[b.id].ind){S.ind.push({id:b.id,age:0,cut:0});}S.f[b.id]++;S.built++;logIt(FAC[b.id].n+'建成投用。','good');S.build.splice(i,1);}}
    else{b.stalled=true;}}
  M.p2Completed=settleProjectCompletions();
  if(S.sbUnspent>1){if(wlCostLeft()<=0)S.sbIdle++;else S.sbIdle=0;
    if(S.sbIdle===6){S.rep-=3;logIt('专项债资金闲置半年，被审计点名。','bad');}
    if(S.sbIdle>=12){const x=S.sbUnspent;S.cash-=x;book('financing',-x,'闲置专项债退回');S.sb.sort((a,b)=>b.amt-a.amt);let left=x;for(const b of S.sb){const y=Math.min(b.amt,left);b.amt-=y;left-=y;if(left<=0)break;}S.sb=S.sb.filter(b=>b.amt>1);S.sbUnspent=0;S.sbIdle=0;S.rep-=3;logIt('专项债资金长期闲置，额度被扣回'+fmt(x)+'。','bad');}}
  else S.sbIdle=0;
  /* 指标 */
  for(const x of S.ind){x.age++;if(x.cut>0)x.cut--;}
  const J=jobs(),E=eff();
  const m1=v=>Math.min(1,v);
  /* 按设施权重通用计算：lw 宜居 pw 繁荣 ew 环境 hw 房价 sw 满意度 */
  let pw=0,lw=0,ew=0,hw=0,sw=0;
  for(const k of FACORDER){const F=FAC[k];if(F.ind)continue;const c=m1(cov(k));if(F.pw)pw+=F.pw*c;if(F.lw)lw+=F.lw*c;if(F.ew)ew+=F.ew*c;if(F.hw)hw+=F.hw*c;if(F.sw)sw+=F.sw*c;}
  const _mx=indMix();const prosT=26+40*m1(J)+pw+6*(E-0.6)+(S.flags.push?3:0)+10*_mx.tech-3*_mx.mfg;
  const livT=18+lw+(S.env-50)/5-S.housing/8;
  let _pT=prosT,_lT=livT;
  if(S.lvl>=4&&S.dist&&S.dist.length){const _da=distAvg();_pT=prosT*0.45+_da.pros*0.55;_lT=livT*0.45+_da.liv*0.55;}
  S.pros+= (_pT-S.pros)*0.07;S.liv+=(_lT-S.liv)*0.08;
  const satT=0.55*S.liv+0.25*(100-S.housing)+0.2*m1(J)*100+sw;S.sat+=(satT-S.sat)*0.06;
  const ec=environmentMonth(ew);M.environment=ec;
  if(hw)S.housing=clamp(S.housing-hw,0,100);
  S.pros=clamp(S.pros,0,100);S.liv=clamp(S.liv,0,100);S.sat=clamp(S.sat,0,100);S.env=clamp(S.env,0,100);
  S.pop*=1+0.0015*(S.liv-50)/10+0.002*(Math.min(J,1.2)-0.6)-(S.housing>70?0.001:0)+(S.eraPop||0);
  S.housing=clamp(S.housing-0.5,0,100);S.rep+=(50-S.rep)*0.01;S.unity+=(npcUnityMid()-S.unity)*0.02;
  if(S.lvl>=3&&S.talent){S.cash-=talentCost();book('policy',-talentCost(),'人才政策');S.pop*=1+0.0007*S.talent;S.pros+=0.04*S.talent;}
  if(S.taxcut>0)S.taxcut--;if(S.nosell>0)S.nosell--;
  /* 事故 */
  if(S.accRisk>0&&Math.random()<0.03*S.accRisk){S.accRisk=0;S.sched.push({id:'accident',m:0});}
  S.monthly=M;closeFinanceMonth(M);getters();
  /* 事件 */
  const due=S.sched.filter(x=>x.m<=0);S.sched=S.sched.filter(x=>x.m>0);for(const x of S.sched)x.m--;
  let evQueue=due.map(x=>x.id);
  /* 冷却：同一事件一年内几乎不重复，两年内低概率，四年后恢复 */
  const now=S.year*12+S.month;S.seen=S.seen||{};
  const _wd=windOf().wd||[];
  const cool=id=>{const t=S.seen[id];if(t===undefined)return 1;const a=now-t;return a<12?0.03:a<24?0.2:a<48?0.6:1;};
  const draw=(list,base)=>{const pool=list.map(e=>[e,base(e)*cool(e.id)]).filter(x=>x[1]>0);if(!pool.length)return null;const tot=pool.reduce((a,x)=>a+x[1],0);let r=Math.random()*tot;for(const [e,w] of pool){r-=w;if(r<=0)return e.id;}return pool[pool.length-1][0].id;};
  if(!evQueue.length){
    const pPet=(S.agFlag&&S.agFlag.nopet)?0:(S.month%3===0?0.5:(S.sat<40?0.15:0.08))*npcPetMul();
    if(Math.random()<pPet){const id=draw(PET.filter(p=>!p.id.endsWith('2')&&(!p.cond||p.cond(S))),p=>(p.mo&&p.mo.indexOf(S.month)>=0?3.5:1)*(_wd.indexOf(p.id)>=0?2.2:1));if(id)evQueue.push(id);}
    else if(Math.random()<0.6){const id=draw(EV.filter(e=>e.w>0&&S.lvl>=e.lv[0]&&S.lvl<=e.lv[1]&&!(e.once&&S.once[e.id])&&(!e.cond||e.cond(S))),e=>e.w*(e.mo&&e.mo.indexOf(S.month)>=0?3.5:1)*(_wd.indexOf(e.id)>=0?2.2:1));if(id)evQueue.push(id);}}
  for(const id of evQueue)S.seen[id]=now;
  S.month++;let annualDue=false;if(S.month>12){S.month=1;annualDue=true;}
  return {evQueue,annualDue};
}

/* ---- 年终 ---- */
function annual(){
  S.year++;S.age++;S.tenure++;S.recruitThisYear=0;S.sbYear=0;S.staff=Math.round(S.staff*0.985);S.quota=Math.round(staffNeed()*1.06);
  const R={};R.year=S.year-1;
  const sanctionsYr=S.file.filter(f=>f.mild&&f.exp&&f.expY===R.year).length;
  const W=windOf();R.W=W;R.wind=W.id;
  R.debtPen=Math.max(0,hdr()-60)/4*(W.debt||1);R.accPen=S.accidentsYr*10;R.cleanPen=sanctionsYr*8*(W.clean||1);
  R.rank=S.lvl>=3?myRank():0;R.rankBonus=R.rank?[0,3,0,-3][R.rank]:0;
  R.raw=W.w[0]*S.pros+W.w[1]*S.liv+W.w[2]*S.sat+(W.env||0)*S.env-R.debtPen-R.accPen-R.cleanPen+R.rankBonus;
  let g=R.raw>=76?'A':R.raw>=60?'B':R.raw>=45?'C':'D';
  R.sanbao=S.sanbaoYr>0;if(R.sanbao){const stp=W.sanbao||1;for(let i=0;i<stp;i++)g=g==='A'?'B':g==='B'?'C':'D';}
  R.grade=g;R.tension=tension();const gain={A:30,B:18,C:8,D:-12}[g];S.merit+=gain;R.gain=gain;
  S.dRun=g==='D'?S.dRun+1:0;S.ratings.push(g);R.rep=S.rep;
  nAdd('boss',{A:4,B:0,C:-5,D:-10}[g]);if(S.file.some(f=>!f.exp&&!f.mild))nAdd('insp',-3);
  if(g==='A'){S.rep+=3;if(Math.random()<0.5)S.sched.push({id:'commend',m:1});}
  /* 倒查 */
  R.exposed=null;
  for(const f of S.file){if(f.exp)continue;
    if(f.mild){if(S.year-f.y<=2&&Math.random()<0.15*(W.expose||1)*npcExpMul()){f.exp=true;f.expY=S.year;S.sanctions++;S.rep-=4;S.merit-=6;logIt('通报处分：'+f.t+'。','bad');}}
    else{const p=(0.05*f.sev+0.03*(S.year-f.y))*S.expMult*(W.expose||1)*npcExpMul();if(Math.random()<p){f.exp=true;f.expY=S.year;R.exposed=f;}}}
  S.expMult=Math.max(1,S.expMult*0.8);
  /* 化债任务书 */
  if(S.task){if(hdr()<=S.task.target){logIt('化债任务书按期完成。','good');S.task=null;S.frozen=false;}
    else if(S.year>=S.task.deadline){S.frozen=true;S.rep-=5;logIt('化债任务书到期未完成，新增融资冻结。','bad');S.task={deadline:S.year+1,target:hdr()*0.8};}}
  else if(hdr()>=70){S.task={deadline:S.year+1,target:hdr()*0.8};S.sched.push({id:'task_notice',m:0});}
  if(S.frozen&&hdr()<60&&!S.task){S.frozen=false;logIt('隐性债务率回落，融资冻结解除。','good');}
  for(const k in S.npc)S.npc[k].f=clamp(S.npc[k].f+(50-S.npc[k].f)*0.03,0,100);
  S.windLeft=(S.windLeft||0)-1;if(S.windLeft<=0)windShift();
  S.spotYr=0;
  S.landHist=(S.landHist||[]).concat([{y:R.year,rev:S.landRev||0,inc:annualIncome()}]).slice(-6);S.landRev=0;
  if(S.lvl>=1){const keep=(S.plots||[]).filter(p=>(p.held||0)<2);S.plots=keep.concat(genPlots(Math.max(1,3-keep.length)));}
  if(S.lvl>=2){const kp=(S.leads||[]).filter(l=>S.year-l.y<2);S.leads=kp.concat(genLeads(Math.max(1,3-kp.length)));}
  if(S.lvl>=3){rivalStep();if(!S.bigp||S.year-S.bigp.y>=1)newBigP();}
  if(S.lvl>=4)distStep();
  eraStep();histStep();
  S.sanbaoYr=0;S.accidentsYr=0;S.flags.push=0;
  S.resume.push({y:R.year,t:LV[S.lvl].city+'第'+S.tenure+'年，年度考核'+g+'，政绩'+Math.round(S.merit)});
  /* 仕途判定 */
  R.next=null;R.envVeto=S.env<30||!!S.phase1.envLock;
  if(R.exposed)R.next='fall';
  else if(S.sanctions>=4||S.dRun>=2)R.next='fired';
  else if(S.age>=retAge())R.next='retire';
  else if(S.env>=30&&!S.phase1.envLock&&S.lvl<4&&S.merit>=LV[S.lvl].need*npcNeedMul()&&R.tension<=60&&!S.task&&S.unity>=35&&(g==='A'||g==='B')){
    const risk=S.file.filter(f=>!f.exp&&!f.mild);let caught=null;for(const f of risk){if(Math.random()<(0.05*f.sev+0.03*(S.year-f.y))*2){f.exp=true;f.expY=S.year;caught=f;break;}}
    R.next=caught?'fall':'promote';if(caught)R.exposed=caught;}
  else if(S.tenure>=LV[S.lvl].maxY&&S.lvl<4)R.next='sidelined';
  return R;
}
function checkInstant(){
  if(S.interestMiss>=6||hdr()>=150)return 'debt';
  if(S.gaps.wage>=6)return 'sanbao';
  return null;

function bindPanel(){

  document.querySelectorAll('[data-talent]').forEach(b=>b.onclick=()=>{S.talent=+b.dataset.talent;renderAll();});
  document.querySelectorAll('[data-coop]').forEach(b=>b.onclick=()=>{const e=coopDo(+b.dataset.coop,b.dataset.cid);if(e)toast(e);renderAll();});
  document.querySelectorAll('[data-bid]').forEach(b=>b.onclick=()=>{const e=bidBig(+b.dataset.bid);if(e)toast(e);renderAll();});
  document.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{const e=leadAct(+b.dataset.lead,b.dataset.how);if(e)toast(e);renderAll();});
  document.querySelectorAll('[data-plot]').forEach(b=>b.onclick=()=>{const e=plotAct(+b.dataset.plot,b.dataset.how);if(e)toast(e);renderAll();});
  document.querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>{S.ag=b.dataset.ag;renderAll();});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.buildCat=b.dataset.cat;renderAll();});

  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{cancelBuild(+b.dataset.cancel);renderAll();});
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=()=>{const e=fn();if(e)toast(e);renderAll();};};
  on('#btnSell',()=>sellLand(+$('#landN').value));on('#btnCQ',()=>issueCQ(+$('#cqN').value,+$('#cqT').value));on('#btnSB',()=>issueSB(+$('#sbN').value,+$('#sbT').value));

  const rr=$('#resRate');if(rr)rr.oninput=()=>{S.reserveRate=+rr.value;$('#resRateV').textContent=rr.value+'%';};

function showDoc(html,cls){$('#doc').className='doc '+(cls||'');$('#doc').innerHTML=html;$('#modal').classList.add('on');}

function showEvent(ev,done){const kind=ev.kind||(ev.id.startsWith('p_')?'信访件':SYSEV[ev.id]?'通知':/^r\d$/.test(ev.id)?'退休第'+S.retY+'年':'呈批件');
  const A=evArt(ev);const nk=evNpc(ev);
  const sub=t=>nk?String(t).replace(/〔人〕/g,npcName(nk)).replace(/〔名〕/g,nn(nk)):String(t);
  const by=nk?`<div class="by"><b>${esc(npcName(nk))}</b><span class="fbar"><i style="width:${nf(nk)}%"></i></span><em>${relLabel(nf(nk))}</em></div>`:'';
  showDoc(`${A.wide?artBox(A.wide,'wide'):artBox(A.scene)}<div class="dh"><div class="kind">${kind}</div><h2>${esc(sub(ev.title))}</h2>${by}</div><div class="body${A.portrait?' hasp':''}">${artPortrait(A.portrait)}<div>${esc(sub(ev.text))}</div></div><div class="opts">${ev.opts.map((o,i)=>{const blocked=eventAdmission(o.fx);const ok=reqOk(o)&&!blocked;const note=blocked|| (reqOk(o)?o.n:'需要'+npcName(o.req.k)+'的信任（'+o.req.v+'，当前 '+nf(o.req.k)+'）');
    return `<button class="opt${o.grey?' grey':''}${ok?'':' dis'}" data-i="${i}"${ok?'':' disabled'}><span class="ot">${esc(sub(o.t))}</span>${note?'<span class="on">'+esc(sub(note))+'</span>':''}</button>`;}).join('')}</div>`);
  document.querySelectorAll('#doc .opt').forEach(b=>b.onclick=()=>{const o=ev.opts[+b.dataset.i];if(!reqOk(o)||eventAdmission(o.fx))return;applyFx(o.fx);if(ev.once)S.once[ev.id]=1;logIt('【'+ev.title+'】'+o.t+(o.grey?'（进入责任档案）':''),o.grey?'bad':'');hideDoc();if(o.end){busy=false;endGame(o.end);renderAll();showEnding();return;}done();});}
function showReview(R,done){const L=LV[S.lvl];
  showDoc(`<div class="dh"><div class="kind">年度考核通报</div><h2>关于第 ${R.year} 年度${esc(L.city)}综合考核结果的通报</h2></div><div class="body"><div class="row" style="align-items:flex-end"><span class="grade">${R.grade}</span><span class="muted" style="padding-bottom:6px">${{A:'优秀',B:'良好',C:'合格',D:'不合格'}[R.grade]}${R.sanbao?'（三保出现缺口，压 '+(R.W.sanbao||1)+' 档）':''}</span></div>
  <table style="margin:10px 0"><tr><td>综合得分</td><td class="r">${R.raw.toFixed(1)}</td></tr><tr><td>考核风向</td><td class="r">${esc(R.W.n)}</td></tr><tr><td>繁荣 ×${R.W.w[0]} / 宜居 ×${R.W.w[1]} / 满意 ×${R.W.w[2]}${R.W.env?' / 环境 ×'+R.W.env:''}</td><td class="r">${(R.W.w[0]*S.pros).toFixed(0)} / ${(R.W.w[1]*S.liv).toFixed(0)} / ${(R.W.w[2]*S.sat).toFixed(0)}${R.W.env?' / '+(R.W.env*S.env).toFixed(0):''}</td></tr><tr><td>债务扣分${R.W.debt!==1?'（×'+R.W.debt+'）':''}</td><td class="r">−${R.debtPen.toFixed(1)}</td></tr><tr><td>事故扣分</td><td class="r">−${R.accPen}</td></tr><tr><td>廉政扣分${R.W.clean!==1?'（×'+R.W.clean+'）':''}</td><td class="r">−${R.cleanPen.toFixed(1)}</td></tr><tr><td>政绩变动</td><td class="r">${R.gain>0?'+':''}${R.gain}　累计 ${Math.round(S.merit)}</td></tr>${R.rank?`<tr><td>省内位次</td><td class="r">第 ${R.rank} 名　${R.rankBonus>0?'+':''}${R.rankBonus}</td></tr>`:''}<tr><td>财政紧张度</td><td class="r">${R.tension.toFixed(0)}</td></tr></table>
  ${R.next==='promote'?'<p><b>组织部门已启动考察程序。</b></p>':R.next==='fall'?'<p style="color:var(--red)"><b>纪委监委在考察中发现线索。</b></p>':R.next==='sidelined'?'<p>本任年限已满。</p>':''}${R.envVeto?'<p class="neg">环境未达晋升要求，本年度暂停提拔；完成整改后可重新参评。</p>':''}${R.accountabilityBlock?'<p class="neg">处于项目责任观察期，暂缓提拔，处分和项目责任继续留档。</p>':''}<span class="seal">考核办</span></div><div class="opts"><button class="opt" id="rvOk"><span class="ot">知道了</span></button></div>`,'notice');
  $('#rvOk').onclick=()=>{hideDoc();done();};}

/* ---- 推进 ---- */
let busy=false;
function next(){if(busy||!S||S.over)return;busy=true;
  if(S.phase==='retired'){const ev=retiredStep();if(!ev){busy=false;return;}showEvent(ev,()=>{busy=false;save();renderAll();});return;}
  const before={y:S.year,m:S.month,cash:S.cash,pros:S.pros,liv:S.liv,sat:S.sat,env:S.env,hdr:hdr(),pop:S.pop,rep:S.rep,unity:S.unity,seq:S.logSeq||0,building:S.build.length};
  runAgenda();
  const {evQueue,annualDue}=tick();agRefresh();renderAll();
  const inst=checkInstant();if(inst){endGame(inst);renderAll();showEnding();busy=false;return;}
  const runEvents=(i,after)=>{if(i>=evQueue.length){after();return;}const ev=findEvent(evQueue[i]);if(!ev){runEvents(i+1,after);return;}showEvent(ev,()=>{renderAll();if(S.over)return;runEvents(i+1,after);});};
  showMonthly(before,()=>runEvents(0,()=>{if(!annualDue){busy=false;save();renderAll();return;}
    const R=annual();renderAll();showReview(R,()=>{
      if(R.next==='fall'){closeLevel();endGame('fall');renderAll();showEnding();busy=false;return;}
      if(R.next==='fired'){closeLevel();endGame('fired');renderAll();showEnding();busy=false;return;}
      if(R.next==='sidelined'){closeLevel();endGame('sidelined');renderAll();showEnding();busy=false;return;}
      if(R.next==='retire'){closeLevel();S.phase='retired';S.retY=0;logIt('到龄退休。','sys');showDoc(`<div class="dh"><div class="kind">通知</div><h2>关于退休的通知</h2></div><div class="body">${S.age} 岁，到点了。${LV[S.lvl].rank}的年龄界限就在这里，组织谈话很短，感谢了你的工作。办公室的人帮你收拾东西，一个纸箱就装完了。\n\n往后几年，每次推进是一年。</div><div class="opts"><button class="opt" id="rtOk"><span class="ot">离开办公室</span></button></div>`,'notice');$('#rtOk').onclick=()=>{hideDoc();busy=false;save();renderAll();};return;}
      if(R.next==='promote'){const nl=S.lvl+1;showPromo(nl,()=>{initLevel(nl,S.merit*0.25);S.resume.push({y:S.year,t:'任'+LV[nl].city.replace(/（.*/,'')+LV[nl].t});logIt('到任'+LV[nl].city+'。','sys');busy=false;save();renderAll();preloadArt();});return;}

function collectProjectGrant(p){

 const amount=p.grant.amount;p.grant.paid=amount;p.grant.status='paid';p.grant.paidAt=projectMonth();S.cash+=amount;book('grant',amount,p.n+(p.kind==='municipal'?'市政验收定额补助':'项目专项补贴'));

function finishProject(p){
 const P=phase2Ensure(),g=pollutionGrade(p.fac),q=roleQuality('urban'),eco=roleQuality('eco');p.completed=projectMonth();p.paid=p.cost;
 p.risk={quality:Math.max(p.risk.quality,p.kind==='municipal'?(1-q)*.35:0),environment:Math.max(p.risk.environment,g>=2?g*.11*(1-eco):0),safety:Math.max(p.risk.safety,g>=3?g*.06*(1-q):0)};
 if(p.kind==='municipal'&&Math.random()<Math.min(.35,.12*(1-q)+p.risk.quality*.08)){
  p.status='rectification';p.accepted=false;p.deliveryHeld=true;S.f[p.fac]=Math.max(0,S.f[p.fac]-1);p.risk.quality=.7;p.warningAt=projectMonth();logIt(p.n+'未通过工程质量验收，补助暂缓，需安排整改。','bad');

 S.merit-=severity*6;S.rep=clamp(S.rep-severity*4,0,100);S.unity=clamp(S.unity-severity*2,0,100);nAdd('boss',-8*severity);S.accidentsYr++;
 S.accountabilityUntil=Math.max(S.accountabilityUntil||0,now+12);S.file.push({y:S.year,t:p.city+'「'+p.n+'」'+reason+'，项目责任追究',sev:0,exp:true,expY:S.year,mild:true,projectId:p.uid});S.sanctions++;
 if(local){S.sat=clamp(S.sat-severity*3,0,100);if(p.risk.environment>0)envChange(-4*severity,'event');}
 if(p.grant.paid>0&&!p.grant.recovered){const amount=p.grant.paid;p.grant.recovered=amount;p.grant.status='recovered';if(local){S.cash-=amount;book('grantReturn',-amount,'违规项目补贴追回：'+p.n);}else p.recoveryBorneByCity=amount;}

function equipmentStep(){

  e.wear=clamp(e.wear+1+Math.max(0,load-1)*.3,0,100);

  if(e.wear>=70&&!e.offline&&Math.random()<.02*(e.wear/100)**2*(1.3-roleQuality('urban')*.5)){e.offline=2;S.sat=clamp(S.sat-2,0,100);nAdd('boss',-2);const p=projectById(e.riskId);if(p)recordProjectIncident(p,'长期设备隐患导致供给故障',1);logIt(FAC[type].n+'发生设备故障，2个月内有效容量减半；检修可提前恢复。','bad');}
 }

function targetedInspection(){

 for(const p of localProjects().filter(p=>p.status==='operating'||p.status==='rectification')){
  const g=pollutionGrade(p.fac),prob=m===12&&p.grant.paid>0?1:m===1&&g>=3?.8:.4;if(Math.random()>prob&&p.status!=='rectification')continue;checked++;

 }
 const id='p2_notice_'+S.year+'_'+m+'_'+P.site;S.policyNotices[id]={id,name,city:LV[S.lvl].city,month:m,year:S.year,checked,findings,handled:false};return id;

function projectResponsibilityStep(){

function factoryUnits(){if(p3Initializing||!S.phase3)return S.f.factory||0;const fs=S.phase3.firms.filter(f=>f.generic);return fs.reduce((a,f)=>a+firmFactor(f),0)+Math.max(0,(S.f.factory||0)-fs.filter(f=>f.stage!=='closed').length);}
function industryUnits(id){return id==='factory'?factoryUnits():S.ind.reduce((a,x,i)=>a+(x.id===id?indFactor(x,i):0),0);}
function firmById(uid){return phase3Ensure().firms.find(f=>f.uid===uid);}
function businessCash(){return Math.max(0,S.cash-(S.sbUnspent||0));}

function firmRef(f){return (FAC[f.fac]?.cost||1200)*S.sc;}

 if(kind==='p3_aid'&&f.aid.filter(t=>projectMonth()-t<12).length>=2)return '同一企业12个月最多帮扶两次';
 if(kind==='p3_expand'){if(f.stage!=='stable'||f.expansion||f.capacity>=1.5)return '仅可对稳定企业扩产一次';const g=industryGate(f.fac,S.planZone||'mixed');if(g)return g;const land=(FAC[f.fac]?.land||40)*S.lsc*.35*.5;if(landFree('ind')<land)return '扩产工业用地不足';}
 if(kind==='p3_move'){const g=industryGate(f.fac,S.planZone||'mixed');if(g)return g;if(f.expansion)return '扩产期间不能搬迁';const land=(FAC[f.fac]?.land||40)*S.lsc*.35*f.capacity;if(landFree('ind')<land)return '搬迁接收地工业用地不足';}
 return null;
}
function firmWork(kind,uid){if(S.phase==='retired'||S.over)return '当前不能办理企业调整';const err=firmGate(kind,uid);if(err)return err;const f=firmById(uid),base=firmRef(f),ratio=kind==='p3_aid'?.08:kind==='p3_expand'?.3:kind==='p3_move'?.25:.05,cost=Math.round(base*ratio);
 if(!spendBusiness(cost,'企业经营调整：'+f.name))return '企业调整经费不足，需要'+fmt(cost);

 if(kind==='p3_aid'){f.aid.push(projectMonth());f.health=Math.min(100,f.health+22);f.bad=Math.max(0,f.bad-4);f.protectedUntil=projectMonth()+6;if(['difficulty','reduced'].includes(f.stage))f.stage='stable';return f.name+'完成阶段性帮扶，6个月内稳产；反复帮扶不会提高基础产能。';}

 if(kind==='p3_move'){const land=(FAC[f.fac]?.land||40)*S.lsc*.35*f.capacity;landTake(land,'ind','企业搬迁');if((pollutionGrade(f.fac)===4&&S.lvl===1)||(pollutionGrade(f.fac)===3&&S.lvl===0))S.phase1.permits[f.fac]--;f.stage='relocating';f.move={left:4,land,cost};return f.name+'在本任辖区内搬迁，4个月停产；旧址不自动转为可开发土地，责任档案继续保留。';}
 closeFirm(f,'有序退出');return f.name+'有序退出；税收、就业与资源消耗同步停止，土地不重复返还。';

 if(f.expansion){if(--f.expansion.left<=0){f.capacity=1.5;f.expansion=null;f.stage='stable';logIt(f.name+'扩产完成，产能提高50%。','good');}continue;}

function homeQuote(type,mode){const T=HOME_TYPES[type];if(!T||!['self','private'].includes(mode))return null;const land=Math.max(6,Math.round(S.landTotal*.02)),cost=Math.round(LV[S.lvl].transfer*T.cost*(1+.02*S.year)),price=cost*T.price/100;return {type,mode,land,cost,price,months:T.months,landPrice:Math.round(landPrice()*land*clamp(phase3Ensure().market.index,.65,1.25))};}

function homeGate(type,mode){const q=homeQuote(type,mode);if(!q)return '开发参数无效';if(roleGate('urban'))return roleGate('urban');if(mode==='self'&&roleGate('finance'))return roleGate('finance');if(S.nosell>0&&mode==='private')return '限供期暂停住宅地出让';if(landFree('res')<q.land)return '可开发住宅用地不足，不能改用工业地或保护地';if(phase3Ensure().homes.filter(h=>['construction','stalled'].includes(h.stage)).length>=2)return '最多同时统筹两个住宅在建项目';const s=homeSupport();if(!Object.values(s).every(Boolean))return '审批缺少配套：'+[!s.road?'道路':'',!s.pipe?'供排水管网/污水处理':'',!s.park?'社区公园':''].filter(Boolean).join('、');if(mode==='self'&&businessCash()<q.cost)return '自主开发需一次垫资'+fmt(q.cost);return null;}

function homeWork(kind,uid){const P=phase3Ensure(),h=P.homes.find(h=>h.uid===uid);if(!h||h.stage==='sold')return '项目不存在或已售罄';const gate=roleGate('urban');if(gate)return gate;let cost=0;
 if(kind==='p3_regulate'){if(h.mode!=='private'||h.stage==='stalled')return '仅可对仍在运行的外来房企项目加强监管';if(h.regulatedUntil>projectMonth())return '项目仍处于6个月监管保障期';cost=h.cost*.025;}

 else return '未知住宅工作';if(!spendBusiness(Math.round(cost),'住宅监管/保交付：'+h.n))return '财政不足，需要'+fmt(cost);h.developerFunds=Math.max(h.developerFunds,65);h.regulatedUntil=projectMonth()+6;h.riskMonths=0;if(h.stage==='stalled'){h.stage='construction';h.left=Math.max(2,h.left);const p=projectById(h.project);if(p)p.status='estate_construction';h.rescueCost=(h.rescueCost||0)+Math.round(cost);}return h.n+'已落实'+(kind==='p3_rescue'?'保交付投入；个人既有责任保留':'资金监管，6个月内降低资金链风险')+'。';}

 n.handled=true;return null;}
function schedulePhase3(kind,target){if(S.phase==='retired'||S.over)return '当前不能安排专项工作';if(!AG[kind])return '专项工作不存在';let e=null;if(['p3_aid','p3_expand','p3_move','p3_close'].includes(kind))e=firmGate(kind,target);if(kind==='p3_land')e=roleGate('commerce');if(e)return e;phase3Ensure().action={kind,target};S.ag=kind;logIt('已安排'+AG[kind].n+'，使用本月唯一亲自抓的工作机会。');return null;}
for(const [id,n] of [['p3_aid','帮扶企业稳产'],['p3_expand','企业扩产审批'],['p3_move','辖区内企业搬迁'],['p3_close','企业有序退出'],['p3_regulate','房企资金监管'],['p3_rescue','停工住宅保交付'],['p3_land','争取年度工业用地指标'],['p3_petition','产业信访专项整改']])AG[id]={n,cat:'专项',cond:()=>false,cd:1,d:'使用当月唯一工作机会，执行时复核资金、人员与资格。',f:()=>{const a=phase3Ensure().action;if(!a||a.kind!==id)return '专项工作目标已失效';const text=id==='p3_land'?landContest():id==='p3_petition'?petitionWork(a.target,'rectify'):id==='p3_regulate'||id==='p3_rescue'?homeWork(id,a.target):firmWork(id,a.target);return text||'专项工作已完成。';}};
const _p3Init=initLevel,_p3Migrate=migrate,_p3Load=load,_p3Close=closeLevel,_p3Tick=tick,_p3FinClose=closeFinanceMonth,_p3Find=findEvent,_p3Admission=eventAdmission,_p3Fx=applyFx,_p3LandPrice=landPrice,_p3Settle=settleProjectCompletions;
initLevel=function(lvl,merit){p3Initializing=true;try{_p3Init(lvl,merit);}finally{p3Initializing=false;}phase3Reset(false);};
migrate=function(){_p3Migrate();phase3Ensure();};
load=function(){const raw=LS.get('yifang_save'),ok=_p3Load();if(ok&&raw&&!JSON.parse(raw).phase3&&!LS.get('yifang_save_before_v113'))LS.set('yifang_save_before_v113',raw);return ok;};
closeLevel=function(){_p3Close();const h=S.hist.at(-1);if(h&&S.phase3){h.phase3=JSON.parse(JSON.stringify(S.phase3));for(const item of [...S.phase3.homes,...S.phase3.mines]){const p=projectById(item.project);if(p&&['estate_construction','estate_stalled','restoring'].includes(p.status)){p.status='handover';p.handedOverAt=projectMonth();p.remainingMonths=item.left;p.paid=item.mode==='self'?item.cost:(item.paid||0);}}}};
landPrice=function(){const base=_p3LandPrice();if(p3Initializing||!S.phase3)return base;return base*clamp(1-housingInventory()*.0007,.65,1);};
settleProjectCompletions=function(){const result=_p3Settle();syncFirms();return result;};
closeFinanceMonth=function(M){const P=phase3Ensure();housingStep();const restorePaid=mineStep();M.build=(M.build||0)+restorePaid;const notice=industryPetition();if(notice)p3Notices.push(notice);M.phase3={restorePaid,market:P.market.index,inventory:housingInventory(),sales:S.phase1.finance.entries.filter(e=>e.kind==='homeSales').reduce((a,e)=>a+e.amount,0),mines:P.mines.filter(m=>m.stage==='restored').length};_p3FinClose(M);};
tick=function(){const P=phase3Ensure();p3Notices=[];P.notes=[];if(projectMonth()>=P.market.next){P.market.index=clamp(P.market.index+rnd(-.18,.18)+(.98-P.market.index)*.2,.45,1.5);P.market.next=projectMonth()+6;}companyStep();const result=_p3Tick();result.evQueue.push(...p3Notices);return result;};
rivalStep=function(){rival3Year();};
myRank=function(){if(!S.rivals?.length)return 1;const mine=compositeScore(scoreParts());return 1+S.rivals.filter(r=>compositeScore(scoreParts(r))>mine+1e-9).length;};
findEvent=function(id){const n=S.phase3?.notices[id];if(!n)return _p3Find(id);const f=firmById(n.firm);return {id,kind:'信访件',title:n.title,text:'工业片区群众反映「'+(f?.name||'企业')+'」异味、噪声与排水问题。生产和就业需要稳定，群众也要求看到整改进度。\n\n可以拨款整改、先听证限产或暂缓办理。投诉冷却6个月，原有信访与督查件仍照常处理。',opts:[{t:'立即拨款，限期治理',n:'需要环保岗位，经费'+fmt(f?firmRef(f)*.08:0),fx:{p3Pet:{id,how:'rectify'}}},{t:'先听证并限产，安排后续整改',n:'不立即花钱；企业减产，满意度小幅回升',fx:{p3Pet:{id,how:'hear'}}},{t:'暂缓办理，先保生产',n:'满意度下降；既有环保隐患继续保留',fx:{p3Pet:{id,how:'defer'}}}]};};
eventAdmission=function(fx){const old=_p3Admission(fx);if(old)return old;if(fx?.p3Pet){const n=S.phase3?.notices[fx.p3Pet.id],f=n&&firmById(n.firm);if(!n||n.handled||!f)return '事项已处理或失效';if(fx.p3Pet.how==='rectify'){if(roleGate('eco'))return roleGate('eco');if(businessCash()<Math.round(firmRef(f)*.08))return '专项整改经费不足，可先听证限产';}}return null;};
applyFx=function(fx){if(fx?.p3Pet){const gate=eventAdmission(fx);if(gate){logIt(gate,'bad');return;}const e=petitionWork(fx.p3Pet.id,fx.p3Pet.how);if(e)logIt(e,'bad');return;}_p3Fx(fx);};
MECH.business={lv:0,tab:'经营'};
function marketLabel(){const x=phase3Ensure().market.index;return x<.8?'冷淡':x>1.15?'火热':'平稳';}
function workBtn(kind,target,label,disabled=false){return `<button class="sm" data-p3="${kind}" data-target="${target}"${disabled?' disabled':''}>${label}</button>`;}
function vCompanies(){const P=phase3Ensure();syncFirms();return `<div class="sec phase-panel"><h2>企业经营与生命周期</h2><p>产业与住宅市场：<b>${marketLabel()}</b>（${P.market.index.toFixed(2)}）</p><div class="hint">建设期沿用原项目队列。落地后进入爬坡、稳定、困难、减产、扩产、搬迁或退出；产能同时影响税收、就业、水电、污水与污染。老企业按原产能接续，前6个月不新增经营恶化。扩产最多一次、增加50%产能；搬迁只限本任辖区，不转移责任。退出不自动返还旧土地，也不免除追责。专项工作共用原每月一次机会；需招商岗位，搬迁需城建岗位。</div>${P.firms.length?P.firms.slice().reverse().map(f=>`<div class="lead"><div class="lh"><b>${esc(f.name)}</b><span class="tag">${LIFE_NAMES[f.stage]}</span></div><p>企业号 ${f.uid} · 经营健康 ${f.health.toFixed(0)} · 当前产能 ${(firmFactor(f,f.generic?60:S.ind[f.index]?.age||0)*100).toFixed(0)}% · ${POLLUTION[pollutionGrade(f.fac)]||'低污染'}${f.expansion?' · 扩产剩余'+f.expansion.left+'月':''}${f.move?' · 搬迁剩余'+f.move.left+'月':''}</p>${f.stage!=='closed'?`<div class="phase-actions">${workBtn('p3_aid',f.uid,'帮扶 '+fmt(firmRef(f)*.08))}${workBtn('p3_expand',f.uid,'扩产 '+fmt(firmRef(f)*.3),f.stage!=='stable'||f.capacity>=1.5)}${workBtn('p3_move',f.uid,'搬迁 '+fmt(firmRef(f)*.25))}${workBtn('p3_close',f.uid,'有序退出 '+fmt(firmRef(f)*.05))}</div>`:''}</div>`).join(''):'<p class="muted">尚无在营企业；原建设和招商入口保留。</p>'}</div>`;}
function vHomes(){const P=phase3Ensure(),support=homeSupport();return `<div class="sec phase-panel"><h2>住宅开发</h2><div class="hint">仅用住宅储备。自主开发一次垫资，完工后按实际去化收款；出让房企只收土地款和实际销售税，不分售房利润。库存压低后续地价，开发和销售均影响房价压力；高房价继续影响民生。配套可使用已有道路、供排水和公园。旧宗地出让、配建与保障房玩法保留。</div><p>住宅储备 ${landFree('res').toFixed(1)}亩 · 待售库存 ${housingInventory().toFixed(1)}套（标准项目100套）</p><p>配套：道路${support.road?'✓':'不足'} · 供排水${support.pipe?'✓':'不足'} · 公园${support.park?'✓':'不足'}</p><div class="phase-scroll"><table><tr><th>住宅</th><th>用地/工期</th><th>自主投入</th><th>房企土地款</th><th>模式</th></tr>${Object.entries(HOME_TYPES).map(([k,T])=>{const q=homeQuote(k,'self'),g=homeGate(k,'self'),gp=homeGate(k,'private');return `<tr><td>${T.n}</td><td>${q.land}亩 / ${q.months}月</td><td>${fmt(q.cost)}<br>平稳总售值约${fmt(q.price*100)}</td><td>${fmt(q.landPrice)}</td><td><button class="sm" data-home="${k}" data-mode="self"${g?' disabled':''}>自主开发</button><button class="sm" data-home="${k}" data-mode="private"${gp?' disabled':''}>出让房企</button></td></tr>`;}).join('')}</table></div><p class="phase-note">审批提示：${esc(homeGate('basic','self')||'当前可自主开发刚需住宅')}；${esc(homeGate('basic','private')||'当前可向房企供地')}。报价为立项时锁定值；售房金额随未来行情变化，未售库存不计现金、不自动举债。每类去化能力由同类在售项目共享，高端住宅在繁荣不足60时更慢；不保证盈利。平台投入未包括土地机会成本与外部融资费用。</p>${P.homes.slice().reverse().map(h=>`<div class="lead"><b>${esc(h.n)}</b><span class="tag">${({construction:'建设中',selling:'销售中',stalled:'资金链断裂停工',sold:'已售罄'})[h.stage]}</span><p>项目号 ${h.uid} · 工期剩余 ${h.left}月 · 剩余 ${h.remaining.toFixed(1)}/100套 · 已售 ${h.sold.toFixed(1)}套</p><p>平台售房回款 ${fmt(h.received)} · 财政销售税 ${fmt(h.tax)} · ${h.mode==='self'?'垫资本金 '+fmt(h.cost):'土地款 '+fmt(h.landPrice)+' · 房企资金 '+h.developerFunds.toFixed(0)+'/100'}${h.rescueCost?' · 保交付投入'+fmt(h.rescueCost):''}</p>${h.mode==='private'&&h.stage!=='sold'?`<div class="phase-actions">${workBtn('p3_regulate',h.uid,'资金监管 '+fmt(h.cost*.025),h.stage==='stalled'||h.regulatedUntil>projectMonth())}${workBtn('p3_rescue',h.uid,'保交付 '+fmt(h.cost*.3),h.stage!=='stalled')}</div>`:''}</div>`).join('')}</div>`;}
function vMines(){const P=phase3Ensure();return `<div class="sec phase-panel"><h2>退出矿区生态修复</h2><div class="hint">本版中煤矿实际退出后形成矿区台账，不追溯补造老矿坑。需环保与城建岗位；6个月逐月支付、缺钱停工。验收一次加4分，纳入月度一次性加分上限；每月生态加0.15，与原生态设施共用2分上限。修复不把未知产权或保护地变成可售土地，也不会清除事故处分。</div>${P.mines.length?P.mines.map(m=>`<div class="lead"><b>${esc(m.n)}</b><p>${({idle:'待修复',restoring:'修复中',restored:'已修复'})[m.stage]} · 总投入 ${fmt(m.cost)} · 已付 ${fmt(m.paid)} · 剩余${m.left}个月</p>${m.stage==='idle'?`<button class="sm" data-mine="${m.uid}">立项生态修复</button>`:''}</div>`).join(''):'<p class="muted">暂无本版登记的退出煤矿矿区。</p>'}</div>`;}
function vBusiness(){return vCompanies()+vHomes()+vMines();}
function vComposite(){const P=phase3Ensure();ensureRival3();const all=[{n:LV[S.lvl].city,me:true,p:scoreParts()}].concat((S.rivals||[]).map((r,i)=>({n:r.n,p:scoreParts(r),ai:P.rivals[i]}))).sort((a,b)=>compositeScore(b.p)-compositeScore(a.p));return `<div class="sec phase-panel"><h2>多维度综合排名</h2><div class="hint">经济规模代理值（繁荣度）45%＋安全15%＋廉政10%＋生态15%＋民生15%。所有分项0—100；原年度考核权重随风向保留，省内位次改用此综合分，仍为第一+3、第二0、第三−3。这里的经济代理值避免把不同人口规模直接比绝对GDP。</div><div class="phase-scroll"><table><tr><th>城市/人格</th><th>综合</th><th>经济</th><th>安全</th><th>廉政</th><th>生态</th><th>民生</th></tr>${all.map((r,i)=>`<tr><td>${i+1}. ${esc(r.n)}<br>${r.me?'本市':r.ai?.personality==='aggressive'?'激进招商':'稳健保守'}</td><td>${compositeScore(r.p).toFixed(1)}</td>${Object.values(r.p).map(v=>`<td>${v.toFixed(1)}</td>`).join('')}</tr>`).join('')}</table></div>${P.rivals.map((a,i)=>`<p>${esc(S.rivals[i].n)}：债务压力${a.debt.toFixed(0)} · 隐患${(a.risk*100).toFixed(0)} · 已争项目${a.projects} · 获用地指标${a.land}亩；${esc(a.last)}</p>`).join('')}${S.rivals?.length?workBtn('p3_land','','争取年度工业用地指标 · 前期费'+fmt(transferPay()*.08),P.landBidYear===S.year):''}</div>`;}
const _p3Forecast=cashForecast;
cashForecast=function(){const rows=_p3Forecast(),mines=(S.phase3?.mines||[]).filter(m=>m.stage==='restoring').map(m=>({...m}));let accumulated=0;for(const r of rows){let payment=0;for(const m of mines)if(m.left>0){const due=(m.cost-m.paid)/m.left;m.paid+=due;m.left--;payment+=due;}accumulated+=payment;r.restore=payment;r.build+=payment;r.cash-=accumulated;r.available-=accumulated;r.warning=r.cash<0?'现金缺口':r.available<0?'受限资金压力':'可覆盖';}return rows;};
function rivalBidFactor(r,i){const a=S.phase3?.rivals[i];return a?(a.personality==='aggressive'?1.15:.85)*clamp(1-Math.max(0,a.debt-90)/200,.6,1):1;}
function rivalWon(i){const a=S.phase3?.rivals[i];if(a){a.projects++;a.debt=clamp(a.debt+2,0,150);a.risk=clamp(a.risk+.04,0,1);a.last='赢得省级项目，配套支出和治理责任同步增加';}}
const _p3Bind=bindPanel,_p3Region=vRegion,_p3Fin=vFin,_p3Over=vOver,_p3Monthly=showMonthly,_p3Agenda=vAgenda;
vRegion=function(){const html=_p3Region();return vComposite()+html.replace(/<div class="sec"><h2>省内位次<\/h2>[\s\S]*?<\/div><\/div>/,'');};
vOver=function(){return _p3Over()+`<div class="sec phase-panel"><h2>经营提示</h2><p>市场${marketLabel()} · 在营企业 ${phase3Ensure().firms.filter(f=>f.stage!=='closed').length} · 住宅待售 ${housingInventory().toFixed(1)}套。经营页可处理稳产、扩产、住宅开发与矿区修复。</p></div>`;};
vFin=function(){return _p3Fin()+`<div class="sec phase-panel"><h2>住宅资金与第三批存档备份</h2><p>平台住宅未收回投入 ${fmt(phase3Ensure().homes.filter(h=>h.mode==='self').reduce((a,h)=>a+Math.max(0,h.cost-h.received),0))}。开发成本、土地款、销售回款和税收分别入账；未来售房款不计入保守现金流。</p>${LS.get('yifang_save_before_v113')?'<button class="sm" id="btnP3Backup">导出第三批升级前存档</button>':''}</div>`;};
vAgenda=function(){return _p3Agenda()+(S.ag.startsWith('p3_')?`<div class="sec"><b>已选经营工作：${esc(AG[S.ag].n)}</b><p>目标：${esc(phase3Ensure().action?.target||'年度用地指标')}；占用本月原工作机会，推进时执行。</p></div>`:'');};
bindPanel=function(){_p3Bind();document.querySelectorAll('[data-p3]').forEach(b=>b.onclick=()=>{const e=schedulePhase3(b.dataset.p3,b.dataset.target);if(e)toast(e);renderAll();});document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{const e=startHome(b.dataset.home,b.dataset.mode);if(e)toast(e);renderAll();});document.querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>{const e=startMine(b.dataset.mine);if(e)toast(e);renderAll();});const b=$('#btnP3Backup');if(b)b.onclick=()=>{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(LS.get('yifang_save_before_v113'));a.download='一方水土-第三批升级前存档.json';a.click();};};
showMonthly=function(B,done){_p3Monthly(B,done);const body=$('#doc .body');if(body&&$('#modal').classList.contains('on')&&S.monthly?.phase3){const m=S.monthly.phase3;body.insertAdjacentHTML('beforeend',`<div class="sec phase-panel"><h2>企业与住宅复盘</h2><p>市场指数 ${m.market.toFixed(2)} · 待售住宅 ${m.inventory.toFixed(1)}套 · 当月平台销售回款 ${fmt(m.sales)} · 已修复矿区${m.mines}处。</p></div>`);}};

document.addEventListener('DOMContentLoaded',()=>{
  $('#nextbtn').onclick=next;
  $('#btnNew').onclick=()=>{newGame();$('#cover').style.display='none';renderAll();preloadArt();};
  $('#btnLoad').onclick=()=>{if(load()){$('#cover').style.display='none';renderAll();preloadArt();}else alert('没有找到存档。');};
  $('#btnSave').onclick=()=>{save();logIt('已保存。','sys');renderAll();};
  $('#btnExport').onclick=()=>{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S));a.download='一方水土-存档-第'+S.year+'年.json';a.click();};
  $('#btnImport').onclick=()=>$('#fileIn').click();
  $('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);if(!imported.phase3&&!LS.get('yifang_save_before_v113'))LS.set('yifang_save_before_v113',r.result);if(!imported.phase2&&!LS.get('yifang_save_before_v112'))LS.set('yifang_save_before_v112',r.result);if(!imported.phase1&&!LS.get('yifang_save_before_v111'))LS.set('yifang_save_before_v111',r.result);S=imported;migrate();renderAll();logIt('存档已导入。','sys');renderAll();}catch(x){alert('存档文件无法读取。');}};r.readAsText(f);};
  $('#btnReset').onclick=()=>{if(confirm('放弃当前进度，重新开局？')){LS.del('yifang_save');newGame();renderAll();}};
  $('#modal').onclick=e=>{if(e.target.id==='modal'){/* 呈批件必须处理，不允许点空白关闭 */}};
  if(LS.get('yifang_save'))$('#btnLoad').textContent='继续上次';
});
/* ---- 底部「下月」条：按实际高度留出正文空间，避免遮挡末尾卡片 ---- */
(function(){
  var bar=document.querySelector('#side .card.next');
  if(!bar)return;
  var fit=function(){
    var fixed=getComputedStyle(bar).position==='fixed';
    document.body.style.paddingBottom=fixed?(bar.offsetHeight+14)+'px':'';
  };
  fit();
  addEventListener('resize',fit);addEventListener('orientationchange',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(bar);
  document.addEventListener('DOMContentLoaded',fit);
  setTimeout(fit,300);
})();

/* ---- 防误触缩放：iOS Safari 忽略 user-scalable=no，需手动拦截手势 ---- */
(function(){
  var stop=function(e){e.preventDefault();};
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    document.addEventListener(t,stop,{passive:false});
  });
  document.addEventListener('touchmove',function(e){
    if(e.touches&&e.touches.length>1)e.preventDefault();
  },{passive:false});
  document.addEventListener('dblclick',stop,{passive:false});
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},{passive:false});
})();
</script>
